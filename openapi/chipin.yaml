    patch:
      description: |-
        Partially updates a ledger entry. For an expense, only the keys present in the body are
        applied; anything omitted keeps its stored value, and sending an explicit `null` clears
        a field that can be empty (`description`, `category`, `subcategory`).

        Three rules follow from how expenses are stored:
        - `amount`, `participantIds` and `sharingMode` form one split block. Touching any of
          them requires sending all three, because the shares are recomputed from all three at
          once and the sharing mode itself is not persisted.
        - Sending `category` without `subcategory` clears the subcategory, which belonged to the
          previous category. Sending `subcategory` alone validates it against the stored category.
        - An `expense` object with no keys is rejected: there is nothing to apply.

        Membership and known-user rules apply to whoever a patch *adds* to an expense. Someone
        the entry already names stays valid even after leaving the group or dropping the
        known-user link, so such an expense is still editable; adding them to a different
        expense is still rejected.

        A patch whose values resolve to the state the entry already holds is accepted and
        returns the entry, but records no edit: no correction event, no activity, and
        `updatedAt` stays where it was.

        A settlement patch works the same way for `toUserId`, `amount` and `currency`: send only
        the keys to change. None of them can be cleared, so an explicit `null` is rejected, and a
        `settlement` object with no keys is rejected too. Entry type, groupId and the settlement
        debtor are immutable, and `type` must match the entry's original type.
      parameters:
        - deprecated: false
          description: Ledger entry UUID
          example: e5f6a7b8-c9d0-1234-abcd-567890123456
          in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            examples:
              patch_expense_description:
                summary: Edit only the description
                value:
                  expense:
                    description: Dinner at Luigi's (updated)
                  type: EXPENSE
              patch_expense_split:
                summary: Change the split (all three parts)
                value:
                  expense:
                    amount: 92
                    participantIds:
                      - a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      - b2c3d4e5-f6a7-8901-bcde-f12345678901
                    sharingMode:
                      customShares:
                        a1b2c3d4-e5f6-7890-abcd-ef1234567890: 60
                        b2c3d4e5-f6a7-8901-bcde-f12345678901: 32
                      type: EXACT
                  type: EXPENSE
              patch_settlement_amount:
                summary: Edit only the settlement amount
                value:
                  settlement:
                    amount: 45
                  type: SETTLEMENT
              update_expense:
                summary: Replace every expense field
                value:
                  expense:
                    amount: 92
                    category: food
                    currency: USD
                    date: 1717200000
                    description: Dinner at Luigi's (updated)
                    participantIds:
                      - a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      - b2c3d4e5-f6a7-8901-bcde-f12345678901
                    payerId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
