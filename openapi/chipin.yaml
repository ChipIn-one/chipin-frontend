            - USER
            - GROUP
          type: string
        settlement:
          description: Populated when type is SETTLEMENT, null otherwise
          oneOf:
            - $ref: "#/components/schemas/LedgerSettlement"
            - type: "null"
        systemAction:
          description: |-
            System-generated ledger marker. Null means a normal user-created entry.
