        - balancesByCurrency
        - generatedAt
      title: UserBalanceResponse
      type: object
    UserInviteLinkResponse:
      properties:
        inviteToken:
          description: Token for creating a known-user relationship through /users/invite/{inviteToken}
          example: AbCdEfGhIjKlMnOpQrStUvWxYz012345
          maxLength: 32
          minLength: 32
          pattern: ^[A-Za-z0-9_-]{32}$
          type: string
      required:
        - inviteToken
      title: UserInviteLinkResponse
      type: object
    UserSettings:
      properties:
        defaultCategory:
          description: Default category pre-selected for new expenses.
          enum:
            - food
            - transport
            - housing
            - digital
            - shopping
            - lifestyle
            - personal_care
            - sports
            - health
            - travel
            - education
            - finance
            - pets
            - other
          example: other
          type: string
        defaultCurrency:
          description: Default ISO 4217 currency code for new user actions
          example: USD
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
          type: string
        language:
          description: Frontend-controlled language tag; no strict backend validation.
          example: pt-br
          type: string
        saveGroupExpensesToSolo:
          description: Client preference for also recording group expenses in Solo records.
          example: true
          type: boolean
        sex:
          description: User sex. Defaults to `male` for users who never chose one, so this value does not distinguish an explicit choice from the default.
          enum:
            - male
            - female
          example: male
          type: string
        simplifyDebts:
          description: Default preference for simplifying debts in future group-related flows.
          example: true
          type: boolean
