        expense entries. These generated ledger entries are immutable and marked with
        `systemAction`.

        **Owner transfer rules:**
        - If the caller is the OWNER and other active members exist, `newOwnerId` is required.
          Omitting it returns `GROUP.OWNER_MUST_TRANSFER`.
        - If the caller is the OWNER and is the last active member, the group is deactivated
          automatically and `newOwnerId` is ignored.
        - Regular MEMBERs can leave without providing `newOwnerId`.
      operationId: leaveGroup
      parameters:
        - deprecated: false
          description: Group UUID
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          in: path
