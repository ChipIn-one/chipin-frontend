  /stats:
    get:
      description: "Returns the four public landing metrics: expenses split, debts tracked in USD, active groups in the last 60 days and people sharing. All four come from one consistent read and are cached for up to 300 seconds. The response is shared by every caller and carries no personal data, so it is safe for browsers and CDNs to reuse for the advertised freshness window. When current exchange rates are unavailable the last complete result calculated by the server is returned; without one the endpoint answers 503 rather than a partial USD total."
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    activeGroupsCount: 1800
                    debtsTrackedUsd: 1250000.5
                    expensesCount: 25300000
                    peopleSharingCount: 42000
              schema:
                $ref: "#/components/schemas/StatsResponse"
          description: Current public landing metrics
          headers:
            Cache-Control:
              deprecated: false
              description: "Response is reusable by shared caches for 300 seconds. Counters can therefore lag the database by up to twice that: once in the server-side cache and again in the browser or CDN."
              example: public, max-age=300
              required: true
              schema:
                type: string
        "500":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: SYSTEM.INTERNAL
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected server-side failure
        "503":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: SYSTEM.SERVICE_UNAVAILABLE
                    details:
                      provider: currency rates provider is unavailable
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Required upstream dependency is unavailable
      security: []
      summary: Get public platform statistics
      tags:
        - Stats
  /users/invite-link:
