  /users/invite/{inviteToken}:
    get:
      description: |-
        Shows who owns the invite token (display name and avatar, no email) and whether the
        caller and the owner are already known users. Does not accept the invite. Rate-limited
        per user, shared with `GET /groups/invite/{inviteToken}`.
      parameters:
        - deprecated: false
          description: User invite token
          example: AbCdEfGhIjKlMnOpQrStUvWxYz012345
          in: path
          name: inviteToken
          required: true
          schema:
            maxLength: 64
            minLength: 16
            pattern: ^[A-Za-z0-9_-]{16,64}$
            type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    inviter:
                      avatarUrl: https://cdn.chipin.one/avatars/bob.webp
                      displayName: Bob Smith
                    isAlreadyFriend: false
              schema:
                $ref: "#/components/schemas/UserInvitePreviewResponse"
          description: Invite preview
        "400":
          content:
            application/json:
              examples:
                cannot_join_self_invite:
                  value:
                    code: USER.CANNOT_JOIN_SELF_INVITE
                invalid_invite_token:
                  value:
                    code: VALIDATION.INVALID_INVITE_TOKEN
                    details:
                      inviteToken: must be 16-64 characters of A-Z, a-z, 0-9, '_' or '-'
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "`VALIDATION.INVALID_INVITE_TOKEN` — malformed token, rejected before any lookup; `USER.CANNOT_JOIN_SELF_INVITE` — own invite token"
        "401":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: AUTH.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid JWT token
        "404":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: USER.NOT_FOUND
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not found
        "429":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: SYSTEM.RATE_LIMITED
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests from this user; retry after the number of seconds in `Retry-After`
      security:
        - bearerAuth: []
      summary: Preview user invite by token
      tags:
        - Users
    post:
      description: |-
        Establishes a bidirectional known-user relationship between the authenticated user
        and the owner of the invite token. Reusing the same token is idempotent.
      parameters:
        - deprecated: false
          description: User invite token
          example: AbCdEfGhIjKlMnOpQrStUvWxYz012345
          in: path
          name: inviteToken
          required: true
          schema:
            maxLength: 64
            minLength: 16
            pattern: ^[A-Za-z0-9_-]{16,64}$
            type: string
