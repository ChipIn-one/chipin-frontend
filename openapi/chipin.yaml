              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid JWT token
        "404":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: USER.NOT_FOUND
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not found
