        createdAt:
          description: Entry creation timestamp (Unix seconds)
          example: 1717200000
          format: int64
          type: integer
        expense:
          description: Populated when type is EXPENSE, null otherwise
          oneOf:
            - $ref: "#/components/schemas/LedgerExpenseInfo"
            - type: "null"
        groupId:
          description: Group UUID (null for user-scoped entries)
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          format: uuid
          type:
            - string
            - "null"
        id:
