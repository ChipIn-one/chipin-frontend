    patch:
      description: |-
        Any active member, or either user of a direct one, may change it, with no consent from the others.
        Only future bookings change; expenses already booked are edited one by one. An absent key keeps its
        value, and `null` clears an optional one. `payerId` and `groupId` cannot be changed, and naming them
        answers 400. The two users of a direct one cannot be changed either.

        A different `frequency` needs the fields of the new one, as on a create, and starts over: the next
        booking is the first such date strictly after today, and occurrences overdue at that moment are not
        booked. `occurrencesBooked` goes on and `occurrenceLimit` stays the total. The activity event records
        the old and the new values.

        The result must pass the rules of a create, so `amount` alone on an `EXACT` split answers 400.
        Changing the day or the month keeps the period of the next booking, so a period is neither booked
        twice nor skipped. A yearly date moved into the past goes to its nearest date from today on. An `endDate` before the next booking, or an `occurrenceLimit` not above
        `occurrencesBooked`, answers 400.
      parameters:
        - deprecated: false
          description: Recurring expense UUID
          in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            examples:
              change_amount:
                summary: Change only the amount
                value:
                  amount: 17.99
              change_day:
                summary: Move the day of the month
                value:
                  dayOfMonth: 28
              change_frequency:
                summary: Another frequency, with the field it needs
                value:
                  dayOfWeek: 5
                  frequency: WEEKLY
              change_split:
                summary: "Change the split: participants, shares and the amount they sum to"
                value:
                  amount: 18
                  participantIds:
                    - a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    - b2c3d4e5-f6a7-8901-bcde-f12345678901
                  sharingMode:
                    customShares:
                      a1b2c3d4-e5f6-7890-abcd-ef1234567890: 12
                      b2c3d4e5-f6a7-8901-bcde-f12345678901: 6
                    type: EXACT
              clear_end_date:
                summary: Remove the end date
                value:
                  endDate: null
              set_occurrence_limit:
                summary: End after 12 occurrences in total
                value:
                  occurrenceLimit: 12
            schema:
              $ref: "#/components/schemas/UpdateRecurringExpenseRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                changed:
                  summary: "After a change of the amount: bookings so far are kept"
                  value:
                    amount: 17.99
                    category: digital
                    createdAt: 1788256800
                    createdBy: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    currency: EUR
                    dayOfMonth: 5
                    dayOfWeek: null
                    description: Netflix
                    endDate: null
                    frequency: MONTHLY
                    groupId: c3d4e5f6-a7b8-9012-cdef-123456789012
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    monthOfYear: null
                    nextOccurrenceDate: 2026-12-05
                    occurrenceLimit: null
                    occurrencesBooked: 3
                    participantIds:
                      - a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      - b2c3d4e5-f6a7-8901-bcde-f12345678901
                      - d4e5f6a7-b8c9-0123-efab-456789012345
                    payerId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    sharingMode:
                      type: AUTO
                    status: ACTIVE
                    stopReason: null
                    subcategory: subscriptions
                    updatedAt: 1794129300
              schema:
                $ref: "#/components/schemas/RecurringExpenseInfo"
          description: Changed recurring expense
        "400":
          content:
            application/json:
              examples:
                field_validation:
                  summary: Field-level validation error
                  value:
                    code: VALIDATION.INVALID
                    details:
                      amount: must be positive
                      expense.participantIds: must contain at least one user other than the payer
                uuid_validation:
                  summary: Invalid UUID format
                  value:
                    code: VALIDATION.INVALID
                    details:
                      groupId: must be a valid UUID
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
        "401":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: AUTH.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid JWT token
        "404":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: RECURRING_EXPENSE.NOT_FOUND
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Recurring expense not found, or the user may not read it
        "409":
          content:
            application/json:
              examples:
                conflict:
                  summary: Lost a race with a concurrent write; repeat the request
                  value:
                    code: SYSTEM.CONFLICT
                stopped:
                  summary: A stopped recurring expense cannot be changed
                  value:
                    code: RECURRING_EXPENSE.STOPPED
              schema:
