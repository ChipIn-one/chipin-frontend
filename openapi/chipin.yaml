                      customShares:
                        a1b2c3d4-e5f6-7890-abcd-ef1234567890: 60
                        b2c3d4e5-f6a7-8901-bcde-f12345678901: 32
                      type: EXACT
                    subcategory: restaurants
                  type: EXPENSE
              update_settlement:
                summary: Replace every settlement field
                value:
                  settlement:
                    amount: 50
                    currency: USD
                    toUserId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  type: SETTLEMENT
            schema:
              $ref: "#/components/schemas/UpdateLedgerEntryRequest"
        required: true
      responses:
        "200":
          content:
