  /groups:
    get:
      description: |-
        Returns one page of the active groups for which the current user has active membership.
        Each item has the same detail fields as `GET /groups/{id}`. Every active
        member contains requester-relative balances by currency. Each group exposes
        the currency of its latest active manual ledger entry and also
        includes the latest 10 active ledger parent chains, ordered by parent sequence.
        Reversed chains are filtered before applying the per-group limit.
        Groups are ordered by creation time newest first. Pass `nextCursor` from one
        response as `cursor` to fetch the following page. The cursor is an opaque string
        (not a numeric `seq` as in the activity feeds — groups are keyed by creation time
        and id); treat it as a token and never parse it.
      parameters:
        - deprecated: false
          description: Maximum number of groups to return (1–100, default 20). An absent or empty value is treated as omitted; malformed or out-of-range values return HTTP 400.
          in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - deprecated: false
          description: "Opaque pagination cursor from a previous response. An absent or empty value requests the first page; malformed values return HTTP 400. Unlike the activity feeds, whose cursor is the numeric `seq` of a row, groups have no sequence column: pages are keyed by `(createdAt, id)`, and the cursor carries both inside one Base64URL token. Pass it back unchanged."
          example: djF8MjAyNi0wOC0wNVQxMjozNDo1Ni4xMjM0NTZafGMzZDRlNWY2LWE3YjgtOTAxMi1jZGVmLTEyMzQ1Njc4OTAxMg
          in: query
          name: cursor
          required: false
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    items:
                      - coverUrl: null
                        createdAt: 1717200000
                        creator:
                          createdAt: 1717200000
                          displayName: Alice Johnson
                          email: alice@example.com
                          firstName: Alice
                          id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                          lastName: Johnson
                          picture: https://lh3.googleusercontent.com/a/photo-hash
                          updatedAt: 1717200000
                        description: Berlin trip expenses
                        id: c3d4e5f6-a7b8-9012-cdef-123456789012
                        inviteToken: xK9mNp2qR
                        lastUsedCurrency: USD
                        members:
                          - balancesByCurrency: {}
                            user:
                              createdAt: 1717200000
                              displayName: Alice Johnson
                              email: alice@example.com
                              firstName: Alice
                              id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                              lastName: Johnson
                              picture: https://lh3.googleusercontent.com/a/photo-hash
                              updatedAt: 1717200000
                          - balancesByCurrency:
                              USD:
                                currency: USD
                                netBalance: 42.75
                            user:
                              createdAt: 1717200000
                              displayName: Bob Smith
                              email: bob@example.com
                              firstName: Bob
                              id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                              lastName: Smith
                              picture: null
                              updatedAt: 1717200000
