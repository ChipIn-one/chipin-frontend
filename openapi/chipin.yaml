  /groups/{groupId}/activities/{parentActivityId}/children:
    get:
      description: |-
        Returns the requested visible parent activity together with its paginated direct
        child mutation activities, scoped to `{groupId}`. Mirrors the response shape of
        `GET /users/self/activities/{parentActivityId}/children`: `parent` is repeated on
        every page so direct links and reloads do not depend on client cache, `items` is
        ordered by child sequence descending, and `nextCursor` continues that child stream.

        Parent resolution is chain-aware: the root is returned when either the root itself
        or at least one direct child is visible within this group through the caller's
        membership boundaries, so a member who joined mid-chain keeps working links.
        Resolution never leaves the group — a personal chain is not reachable here even for
        its own participant. Missing chains, chains with no visible root or direct children,
        roots belonging to another group, and non-root parent IDs all return the same
        `ACTIVITY.NOT_FOUND` response.
