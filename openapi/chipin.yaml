        displayName:
          description: User's display name shown in the UI
          example: Alice Johnson
          maxLength: 64
          minLength: 1
          type: string
        email:
          description: Authenticated user's email address
          example: alice@example.com
          format: email
          type: string
        id:
          description: Unique user identifier
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
        inviteToken:
          description: Current reusable invite token for the authenticated user
          example: AbCdEfGhIjKlMnOpQrStUvWxYz012345
          maxLength: 32
          minLength: 32
          pattern: ^[A-Za-z0-9_-]{32}$
          type: string
        isPremium:
          description: Whether user has premium access. Read-only for self updates.
          example: false
          type: boolean
        lastSelectedCurrency:
          description: Read-only. Currency of the latest ledger entry this user created themselves, in any group or with any known user; null until the first one. Not a setting, so it is outside `settings` and not accepted by profile update. Unlike `settings.defaultCurrency` the user does not edit it, and unlike group or known-user `lastUsedCurrency` another user's entry never changes it.
          example: VND
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
          type:
            - string
            - "null"
        picture:
          description: URL to user's profile picture
          example: https://lh3.googleusercontent.com/a/photo-hash
          format: uri
          type:
            - string
            - "null"
        premiumExpiresAt:
          description: Premium access expiration timestamp in Unix seconds. Read-only for self updates. Same instant as subscriptionUntil.
          example: 1779011959
          format: int64
          type:
            - integer
            - "null"
        role:
          description: Authorization role. Read-only for self updates.
          enum:
            - USER
            - ADMIN
          example: USER
          type: string
        settings:
          $ref: "#/components/schemas/UserSettings"
        subscriptionUntil:
          description: Subscription expiration timestamp in Unix seconds. Read-only for self updates.
          example: 1779011959
          format: int64
          type:
            - integer
            - "null"
        updatedAt:
          description: Last profile update timestamp (Unix seconds)
          example: 1717200000
          format: int64
          type: integer
