  /dashboard:
    get:
      description: |-
        Returns the authenticated user's dashboard in a single call: their whole
        per-currency balance totals across groups and user-to-user debts, plus
        their latest-state ledger activity previews (most recent active chains first,
        no request cursor — fixed page size on the server side). Group cards are
        returned by `GET /groups`.

        **Activity preview note:** the `activity` section returns at most 20 active ledger chains,
        ordered by root activity sequence descending. Each item contains the stable root event under
        `parent` and the chain's current snapshot under `lastEvent`. Reversed chains are filtered
        before the 20-item limit is applied. Child mutation and reversal rows remain in the flat
        activity log for audit detail and can be fetched through the parent children endpoints.
        Group-scoped events created before the user's current membership session are excluded
        from this preview. Personal events with no group scope remain visible through
        actor/participant rules.

        **Pagination:** `/dashboard` itself takes no parameters — it always returns the first
        page. To load more, pass `activity.nextCursor` as the `cursor` parameter of
        `GET /users/self/activity-previews`, which continues exactly this resolved stream.
        Do not feed it to `GET /users/self/activities`: that endpoint returns flat events and
        does not filter reversed chains.
