                    deletedActivityEvents: 9
                    deletedExpenses: 3
                    deletedGroups: 1
                    deletedSettlements: 1
                    deletedUsers: 2
                    runId: fe-contract-20260907-abc123
              schema:
                $ref: "#/components/schemas/TestRunPurgeResponse"
          description: Counts of the rows removed
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Malformed runId
        "401":
          description: Missing or invalid credentials
        "409":
          content:
            application/json:
