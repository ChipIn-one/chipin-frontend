              summary: Expense-only feed
              value: expense
            settlement:
              summary: Settlement-only feed
              value: settlement
          in: query
          name: category
          required: false
          schema:
            enum:
              - expense
              - settlement
            type: string
        - deprecated: false
          description: |
            Controls hierarchy expansion for activity feeds. Omit the parameter or pass `true`
            to preserve the flat Activity Log behavior by including child mutation activities.
            Pass `false` for parent-only mode, which returns only root ledger activity rows
            (`domain=LEDGER` and no `parentActivityId`).
            Accepted values are strictly `true` and `false`; any other value returns a
