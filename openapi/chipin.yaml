  /groups/invite/{inviteToken}:
    get:
      description: |-
        Shows what the caller is about to join: group id, name, cover, number of active
        members, whether the caller is already an active member, and who invited (the
        group creator's display name and avatar while the creator is an active member,
        otherwise null). Does not join and does not return members, emails or the token.
        A token of a deleted (`INACTIVE`) group answers 404, like an unknown one.
        Rate-limited per user, shared with `GET /users/invite/{inviteToken}`.
      parameters:
        - deprecated: false
          description: Group invite token
          example: xK9mNp2qRs4tUv6wXy8zAb0cDe2fGh4j
          in: path
          name: inviteToken
          required: true
          schema:
            maxLength: 64
            minLength: 16
            pattern: ^[A-Za-z0-9_-]{16,64}$
            type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    coverUrl: https://cdn.chipin.one/group-covers/paris.webp
                    groupId: c3d4e5f6-a7b8-9012-cdef-123456789012
                    inviter:
                      avatarUrl: https://cdn.chipin.one/avatars/alice.webp
                      displayName: Alice
                    isAlreadyMember: false
                    memberCount: 4
                    name: Trip to Paris
              schema:
                $ref: "#/components/schemas/GroupInvitePreviewResponse"
          description: Group preview
        "400":
          content:
            application/json:
              examples:
                invalid_invite_token:
                  value:
                    code: VALIDATION.INVALID_INVITE_TOKEN
                    details:
                      inviteToken: must be 16-64 characters of A-Z, a-z, 0-9, '_' or '-'
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "`VALIDATION.INVALID_INVITE_TOKEN` — the token is not 16-64 characters of `A-Z a-z 0-9 _ -`; rejected before any lookup"
        "401":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: AUTH.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid JWT token
        "404":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: GROUP.NOT_FOUND
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Group not found
        "429":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: SYSTEM.RATE_LIMITED
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests from this user; retry after the number of seconds in `Retry-After`
      security:
        - bearerAuth: []
      summary: Preview group by invite token
      tags:
        - Groups
    post:
      description: |-
        Adds the authenticated user to a group using the group's invite token.
        If the user is already a member, the operation is idempotent. The response
        is the same canonical requester-relative projection as `GET /groups/{id}`.
      parameters:
        - deprecated: false
          description: Unique invite token shared by the group creator
          example: xK9mNp2qRs4tUv6wXy8zAb0cDe2fGh4j
          in: path
          name: inviteToken
          required: true
          schema:
            maxLength: 64
            minLength: 16
            pattern: ^[A-Za-z0-9_-]{16,64}$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
          description: Joined the group, or already a member
        "400":
          content:
            application/json:
              examples:
                group_inactive:
                  value:
                    code: GROUP.GROUP_INACTIVE
                invalid_invite_token:
                  value:
                    code: VALIDATION.INVALID_INVITE_TOKEN
                    details:
                      inviteToken: must be 16-64 characters of A-Z, a-z, 0-9, '_' or '-'
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "`VALIDATION.INVALID_INVITE_TOKEN` — malformed token, rejected before any lookup; `GROUP.GROUP_INACTIVE` — group is inactive"
        "401":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: AUTH.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid JWT token
        "404":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: GROUP.NOT_FOUND
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Group not found
      security:
        - bearerAuth: []
      summary: Join group by invite token
      tags:
        - Groups
  /groups/{groupId}/activities:
    get:
      description: |-
        Returns a paginated activity feed for a specific group, ordered by most recent first.
        Group-scoped events created before the authenticated user's current membership session
        (`group_members.active_since`) are excluded.
        Use cursor-based pagination: pass the `nextCursor` value from the response as the `cursor`
        query parameter to fetch the next page. Use `category=expense` for expense-only feeds or
        `category=settlement` for settlement-only feeds; omit `category` to keep the mixed feed.
      parameters:
        - deprecated: false
          description: The group to fetch activities for
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
        - deprecated: false
          description: Maximum number of activity items to return (1–100, default 50). An absent or empty value is treated as omitted; non-empty malformed or out-of-range values return HTTP 400.
          in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - deprecated: false
          description: Pagination cursor — pass the `nextCursor` value from a previous response to fetch the next page. An absent or empty value is treated as omitted; non-empty malformed or out-of-range values return HTTP 400.
          example: 40
          in: query
          name: cursor
          required: false
          schema:
            format: int64
            minimum: 1
            type: integer
        - deprecated: false
          description: |
            Optional public activity category filter. Use `expense` for expense-only feeds or
            `settlement` for settlement-only feeds. Omit the parameter to preserve the default
            mixed feed containing all visible activity categories.
          examples:
            expense:
              summary: Expense-only feed
