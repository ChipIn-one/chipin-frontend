  /users/self/activities/{parentActivityId}/children:
    get:
      description: |-
        Returns the requested visible parent activity together with its paginated direct
        child mutation activities. `parent` is the full root event and is repeated on every
        page so direct links and reloads do not depend on client cache. `items` is ordered by
        child sequence descending and `nextCursor` continues that child stream.

        Parent resolution is chain-aware: the root is returned when either the root itself
        or at least one direct child is visible through the authenticated user's normal
        personal/group boundaries. This keeps links from the user's feed reloadable without
        exposing unrelated chains. Missing chains, chains with no visible root or direct
        children, and non-root parent IDs all return the same `ACTIVITY.NOT_FOUND` response.

