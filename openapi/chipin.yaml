    UpdateGroupRequest:
      properties:
        coverUrl:
          description: Null or blank is treated as omitted/no change and leaves the existing cover unchanged.
          example: https://images.unsplash.com/photo-berlin-updated
          format: uri
          type:
            - string
            - "null"
        description:
