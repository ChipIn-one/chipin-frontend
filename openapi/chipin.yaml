            type: string
        - deprecated: false
          description: Optional comma-separated supported currency codes to include in the response
          example: EUR,GEL
          in: query
          name: currencies
          required: false
          schema:
            pattern: ^[A-Z]{3}(,[A-Z]{3})*$
            type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                fresh:
                  summary: Fresh cached snapshot
                  value:
                    base: EUR
                    fetchedAt: 1779124200
                    rates:
