  /users/self/activities:
    get:
      description: |-
        Returns a paginated activity feed for the authenticated user across all their groups.
        Includes activities where the user is a participant.
        Group-scoped events created before the user's current membership session are excluded.
        A deleted group's events stay visible to users who were its active members when it was
        deleted, from the start of that membership session; users who left or were kicked
        earlier do not see them.
        Personal events with no group scope remain visible through actor/participant rules.
        Supports cursor-based pagination. Use `category=expense` for expense-only feeds or
        `category=settlement` for settlement-only feeds; omit `category` to keep the mixed feed.
      parameters:
        - deprecated: false
          description: Maximum number of activity items to return (1–100, default 50). An absent or empty value is treated as omitted; non-empty malformed or out-of-range values return HTTP 400.
          in: query
          name: limit
          required: false
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - deprecated: false
          description: Pagination cursor — pass the `nextCursor` value from a previous response to fetch the next page. An absent or empty value is treated as omitted; non-empty malformed or out-of-range values return HTTP 400.
          example: 40
