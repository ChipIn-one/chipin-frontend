  /users/self/activity-previews:
    get:
      description: |-
        Paginated continuation of the `activity` section of `GET /dashboard`. Returns active
        ledger chains as `{ parent, lastEvent }`: `parent` is the stable creation event that
        defines identity and ordering, `lastEvent` carries the current metadata snapshot.

        Differs from `GET /users/self/activities` in two ways, which is why it is a separate
        endpoint: items are resolved pairs rather than flat events, and chains whose latest
        event is a reversal are removed **before** the limit is applied. This filtering does
        not underfill a page while older active chains remain; the final page may be shorter
        than `limit`.

        Pagination is keyset-based on `parent.seq`, which never changes when an entry is
        edited — editing an expense therefore cannot move it across page boundaries. Take
        `nextCursor` from the previous response (or from `GET /dashboard`) and pass it as
        `cursor`. Group-scoped chains created before the user's current membership session
        are excluded; personal chains stay visible through actor/participant rules.

        Debt transfer events (`EXPENSE_TRANSFERRED_TO`, `EXPENSE_TRANSFERRED_FROM`) are removed
        before the limit as well: they are internal machinery of moving debts out of a group and
        stay readable only through `GET /users/self/activities`.
      parameters:
        - deprecated: false
          description: Page size (1–100, default 20). An absent or empty value is treated as omitted; non-empty malformed or out-of-range values return HTTP 400.
          in: query
          name: limit
          required: false
          schema:
            default: 20
            maximum: 100
            minimum: 1
            type: integer
        - deprecated: false
          description: Pagination cursor — pass the `nextCursor` value from a previous response to fetch the next page. An absent or empty value is treated as omitted; non-empty malformed or out-of-range values return HTTP 400.
          example: 40
          in: query
          name: cursor
          required: false
          schema:
            format: int64
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    items:
                      - lastEvent:
                          action: EXPENSE_UPDATED
                          actorSnapshot:
                            displayName: Alice Johnson
                            picture: https://lh3.googleusercontent.com/a/photo-hash
                          actorUserId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                          createdAt: 1717200300
                          domain: LEDGER
                          groupId: c3d4e5f6-a7b8-9012-cdef-123456789012
                          id: d0e1f2a3-b4c5-6789-def0-123456789012
                          metadata:
                            amount: 95.5
                            category: food
                            currency: USD
                            date: null
                            description: Dinner at Luigi's
                            entryId: e5f6a7b8-c9d0-1234-abcd-567890123456
                            fieldDiffs:
                              - field: amount
                                newValue: "95.50"
                                oldValue: "85.50"
                            groupId: c3d4e5f6-a7b8-9012-cdef-123456789012
                            groupName: Weekend Trip
                            payerDisplayName: Alice Johnson
                            payerId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                            recurringExpenseId: null
                            shares:
                              - currency: USD
                                displayName: Alice Johnson
                                shareAmount: 47.75
                                userId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                              - currency: USD
                                displayName: Bob Smith
                                shareAmount: 47.75
                                userId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                            sharingMode:
                              shares:
                                a1b2c3d4-e5f6-7890-abcd-ef1234567890: 1
                                b2c3d4e5-f6a7-8901-bcde-f12345678901: 1
                              type: SHARES
                            subcategory: null
                            type: expense
                          parentActivityId: c9d0e1f2-a3b4-5678-cdef-012345678901
                          seq: 58
                          subjectId: e5f6a7b8-c9d0-1234-abcd-567890123456
