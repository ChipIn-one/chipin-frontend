          type:
            - string
            - "null"
        name:
          description: New group name (max 100 characters)
          example: Berlin Adventure
          maxLength: 100
          type:
            - string
            - "null"
        simplifyDebts:
          description: Whether to simplify debts in this group. Active members may resend the current value; only the owner can change it. Turning it off is refused with `GROUP.SIMPLIFY_DEBTS_LOCKED` once an active settlement was validated against the simplified graph, because such a payment only balances while simplification stays on.
          example: false
          type:
            - boolean
            - "null"
