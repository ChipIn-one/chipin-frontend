components:
  schemas:
    AccessTokenResponse:
      properties:
        token:
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhMWIyYzNkNCJ9.new_access_token
          type: string
      required:
        - token
      title: AccessTokenResponse
      type: object
    ActivityChildrenFeedResponse:
      properties:
        items:
          description: Direct child activity events, ordered by most recent first
          items:
            $ref: "#/components/schemas/ActivityEventResponse"
          type: array
        nextCursor:
          description: Child sequence cursor for the next page. Null if no more pages.
          example: 40
          format: int64
          type:
            - integer
            - "null"
        parent:
          $ref: "#/components/schemas/ActivityEventResponse"
      required:
        - parent
        - items
        - nextCursor
      title: ActivityChildrenFeedResponse
      type: object
    ActivityCommentFeedResponse:
      properties:
        items:
          description: Comments ordered by sequence descending
          items:
            $ref: "#/components/schemas/ActivityCommentResponse"
          type: array
        nextCursor:
          description: Sequence cursor for the next page; null when the thread is exhausted
          format: int64
          type:
            - integer
            - "null"
      required:
        - items
        - nextCursor
      title: ActivityCommentFeedResponse
      type: object
    ActivityCommentResponse:
      properties:
        authorSnapshot:
          $ref: "#/components/schemas/ActorSnapshot"
        authorUserId:
          description: Author UUID; null after the author account is deleted
          format: uuid
          type:
            - string
            - "null"
        createdAt:
          description: Creation timestamp in Unix seconds
          format: int64
          type: integer
        id:
          description: Unique comment ID
          format: uuid
          type: string
        parentActivityId:
          description: Root expense or settlement activity that owns this thread
          format: uuid
          type: string
        seq:
          description: Monotonically increasing sequence used for cursor pagination
          format: int64
          type: integer
        text:
          maxLength: 2000
          minLength: 1
          type: string
        updatedAt:
          description: Last update timestamp in Unix seconds
          format: int64
          type: integer
      required:
        - id
        - seq
        - parentActivityId
        - authorUserId
        - authorSnapshot
        - text
        - createdAt
        - updatedAt
      title: ActivityCommentResponse
      type: object
    ActivityEventResponse:
      properties:
        action:
          description: |-
            Specific action that occurred:
            - GROUP_CREATED/UPDATED/DELETED/DEACTIVATED: group lifecycle events
            - MEMBER_JOINED/LEFT/KICKED and OWNERSHIP_TRANSFERRED: membership changes
            - MEMBERS_ADDED: one or more users added to the group by another member
            - EXPENSE_CREATED/UPDATED/REVERSED: expense lifecycle
            - EXPENSE_TRANSFERRED_TO/FROM: aggregate debt transfer activity
            - SETTLEMENT_CREATED/UPDATED/REVERSED: settlement lifecycle
          enum:
            - GROUP_CREATED
            - GROUP_UPDATED
            - GROUP_DELETED
            - GROUP_DEACTIVATED
            - OWNERSHIP_TRANSFERRED
            - MEMBER_JOINED
            - MEMBER_LEFT
            - MEMBER_KICKED
            - MEMBERS_ADDED
            - EXPENSE_CREATED
            - EXPENSE_UPDATED
            - EXPENSE_REVERSED
            - EXPENSE_TRANSFERRED_TO
            - EXPENSE_TRANSFERRED_FROM
            - SETTLEMENT_CREATED
            - SETTLEMENT_UPDATED
            - SETTLEMENT_REVERSED
          type: string
        actorSnapshot:
          $ref: "#/components/schemas/ActorSnapshot"
        actorUserId:
          description: UUID of the user who performed the action
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type:
            - string
            - "null"
        createdAt:
          description: Event timestamp in Unix seconds
          example: 1717200000
          format: int64
          type: integer
        domain:
          description: "Domain of the activity: GROUP for group management events, LEDGER for expense/settlement events"
          enum:
            - GROUP
            - LEDGER
          type: string
        groupId:
          description: Group context for this event (if applicable)
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          format: uuid
          type:
            - string
            - "null"
        id:
          description: Unique activity event ID
          example: a7b8c9d0-e1f2-3456-abcd-890123456789
          format: uuid
          type: string
        metadata:
          oneOf:
            - discriminator:
                mapping:
                  expense: "#/components/schemas/ExpenseActivityMetadata"
                  expense_transfer: "#/components/schemas/ExpenseTransferActivityMetadata"
                  group: "#/components/schemas/GroupActivityMetadata"
                  settlement: "#/components/schemas/SettlementActivityMetadata"
                propertyName: type
              oneOf:
                - $ref: "#/components/schemas/ExpenseActivityMetadata"
                - $ref: "#/components/schemas/SettlementActivityMetadata"
                - $ref: "#/components/schemas/ExpenseTransferActivityMetadata"
                - $ref: "#/components/schemas/GroupActivityMetadata"
            - type: "null"
        parentActivityId:
          description: Root creation activities have null; later mutation activities point at their parent creation activity.
          example: c9d0e1f2-a3b4-5678-cdef-012345678901
          format: uuid
          type:
            - string
            - "null"
        seq:
          description: Monotonically increasing sequence number, used for cursor-based pagination
          example: 42
          format: int64
          type: integer
        subjectId:
          description: UUID of the affected entity
          example: e5f6a7b8-c9d0-1234-abcd-567890123456
          type: string
        subjectType:
          description: "Type emitted by the activity producer: `expense`, `settlement`, `group`, or `group_debt_transfer`."
          example: expense
          type: string
      required:
        - id
        - seq
        - domain
        - action
        - actorSnapshot
        - subjectType
        - subjectId
        - createdAt
      title: ActivityEventResponse
      type: object
    ActivityFeedResponse:
      properties:
        items:
          description: List of activity events, ordered by most recent first
          items:
            $ref: "#/components/schemas/ActivityEventResponse"
          type: array
        nextCursor:
          description: Cursor value to pass as `cursor` query param for next page. Null if no more pages.
          example: 40
          format: int64
          type:
            - integer
            - "null"
      required:
        - items
        - nextCursor
      title: ActivityFeedResponse
      type: object
    ActivityFieldDiff:
      properties:
        field:
          description: Name of the field that changed
          example: amount
          type: string
        newValue:
          description: New field value serialized as text; null when absent
          example: "95.50"
          type:
            - string
            - "null"
        oldValue:
          description: Previous field value serialized as text; null when absent
          example: "85.50"
          type:
            - string
            - "null"
      required:
        - field
      title: ActivityFieldDiff
      type: object
    ActivityTargetUser:
      properties:
        displayName:
          description: Display name at the time of the event
          example: Carol Davis
          type: string
        userId:
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          format: uuid
          type: string
      required:
        - userId
        - displayName
      title: ActivityTargetUser
      type: object
    ActorSnapshot:
      description: Author profile captured when the comment was created
      properties:
        displayName:
          description: Display name of the actor at the time of the event
          example: Alice Johnson
          type: string
        picture:
          description: Profile picture URL at the time of the event
          example: https://lh3.googleusercontent.com/a/photo-hash
          format: uri
          type:
            - string
            - "null"
      required:
        - displayName
      title: ActorSnapshot
      type: object
    AddGroupMemberRequest:
      properties:
        userId:
          description: Id of the user to add; must be a known user of the caller
          format: uuid
          type: string
      required:
        - userId
      title: AddGroupMemberRequest
      type: object
    CategoriesResponse:
      properties:
        categories:
          description: Expense categories and their valid subcategories
          items:
            $ref: "#/components/schemas/CategoryInfo"
          type: array
      required:
        - categories
      title: CategoriesResponse
      type: object
    CategoryInfo:
      properties:
        name:
          description: Expense category wire value
          enum:
            - food
            - transport
            - housing
            - digital
            - shopping
            - lifestyle
            - personal_care
            - sports
            - health
            - travel
            - education
            - finance
            - pets
            - other
          type: string
        subcategories:
          description: Valid subcategories for this expense category
          items:
            enum:
              - groceries
              - restaurants
              - fast_food
              - coffee
              - food_delivery
              - public_transport
              - taxi
              - fuel
              - vehicle_rent
              - parking
              - vehicle_repair
              - vehicle_insurance
              - tolls
              - rent
              - mortgage
              - utilities
              - home_maintenance
              - furnishing
              - internet
              - mobile
              - subscriptions
              - software
              - clothing
              - electronics
              - home_goods
              - personal_items
              - gifts
              - cinema
              - events
              - concerts
              - games
              - nightlife
              - haircut
              - spa
              - massage
              - beauty_services
              - hygiene
              - skincare
              - cosmetics
              - subscription
              - coach
              - equipment
              - medical
              - pharmacy
              - dental
              - health_insurance
              - flights
              - accommodation
              - activities
              - visa
              - insurance
              - online_courses
              - books
              - tutoring
              - certification
              - fees
              - taxes
              - loans
              - investments
              - crypto
              - currency_exchange
              - cash_withdrawal
              - transfers
              - pet_food
              - vet
              - pet_items
            type: string
          type: array
      required:
        - name
        - subcategories
      title: CategoryInfo
      type: object
    CounterpartyDebt:
      properties:
        amount:
          description: Signed debt amount from the current user's point of view. Positive means the counterparty owes the current user; negative means the current user owes the counterparty.
          example: -28.5
          multipleOf: 0.0001
          type: number
        counterparty:
          allOf:
            - $ref: "#/components/schemas/User"
          description: The other user in this debt relationship
        currency:
          example: USD
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
          type: string
      required:
        - counterparty
        - amount
        - currency
      title: CounterpartyDebt
      type: object
    CreateGroupRequest:
      properties:
        coverUrl:
          description: When omitted or blank, the server assigns a placeholder URL when one is available; otherwise the value remains null.
          example: https://images.unsplash.com/photo-berlin
          format: uri
          type:
            - string
            - "null"
        description:
          description: Optional group description
          example: Berlin trip expenses
          type:
            - string
            - "null"
        memberIds:
          description: "Optional initial members. Every id must be an existing user connected to the creator. Rejected ids fail the whole request: `USER.NOT_FOUND` (404) lists unknown ids, `GROUP.USER_NOT_CONNECTED` (400) lists unconnected ids, both under a `memberIds` details key. Duplicates and the creator's own id are ignored."
          items:
            format: uuid
            type: string
          maxItems: 50
          type:
            - array
            - "null"
        name:
          description: Group name (max 100 characters)
          example: Weekend Trip
          maxLength: 100
          type: string
        simplifyDebts:
          description: Whether to simplify debts in this group. When omitted, uses the creator's profile setting.
          example: true
          type:
            - boolean
            - "null"
      required:
        - name
      title: CreateGroupRequest
      type: object
    CreateLedgerEntryRequest:
      discriminator:
        mapping:
          EXPENSE: "#/components/schemas/CreateLedgerExpenseRequest"
          SETTLEMENT: "#/components/schemas/CreateLedgerSettlementRequest"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/CreateLedgerExpenseRequest"
        - $ref: "#/components/schemas/CreateLedgerSettlementRequest"
      title: CreateLedgerEntryRequest
    CreateLedgerExpensePayload:
      additionalProperties: false
      properties:
        amount:
          description: Decimal amount as a JSON number (max 4 decimal places, must be positive)
          example: 85.5
          exclusiveMinimum: 0
          multipleOf: 0.0001
          type: number
        category:
          description: Optional expense category key
          example: food
          maxLength: 100
          type:
            - string
            - "null"
        currency:
          description: ISO 4217 currency code (auto-uppercased)
          example: USD
          maxLength: 3
          minLength: 3
          pattern: ^[A-Za-z]{3}$
          type: string
        date:
          description: Expense date as Unix timestamp in seconds
          example: 1717200000
          exclusiveMinimum: 0
          format: int64
          type: integer
        description:
          description: Expense description (max 500 characters)
          example: Dinner at Luigi's
          maxLength: 500
          type:
            - string
            - "null"
        participantIds:
          description: UUIDs of users sharing this expense. The payer need not appear in this list; participants owe the whole amount if the payer is omitted. Must contain at least one user other than the payer. User-scoped expense must involve exactly 2 users total (payer + participants), and the authenticated user must be one of them. Max 50 unique users.
          example:
            - a1b2c3d4-e5f6-7890-abcd-ef1234567890
            - b2c3d4e5-f6a7-8901-bcde-f12345678901
          items:
            format: uuid
            type: string
          maxItems: 50
          minItems: 1
          type: array
          uniqueItems: true
        payerId:
          description: UUID of the user who paid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
        sharingMode:
          oneOf:
            - $ref: "#/components/schemas/SharingMode"
            - type: "null"
        subcategory:
          description: Optional expense subcategory key; requires a matching parent category
          example: restaurants
          maxLength: 100
          type:
            - string
            - "null"
      required:
        - amount
        - date
        - payerId
        - participantIds
        - currency
      title: CreateLedgerExpensePayload
      type: object
    CreateLedgerExpenseRequest:
      additionalProperties: false
      properties:
        expense:
          $ref: "#/components/schemas/CreateLedgerExpensePayload"
        groupId:
          description: Group this entry belongs to (optional — omit for user-scoped entries)
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          format: uuid
          type:
            - string
            - "null"
        type:
          enum:
            - EXPENSE
          type: string
      required:
        - type
        - expense
      title: CreateLedgerExpenseRequest
      type: object
    CreateLedgerSettlementPayload:
      additionalProperties: false
      properties:
        amount:
          description: Settlement amount as a JSON number
          example: 42.75
          exclusiveMinimum: 0
          multipleOf: 0.0001
          type: number
        currency:
          description: ISO 4217 currency code
          example: USD
          maxLength: 3
          minLength: 3
          pattern: ^[A-Za-z]{3}$
          type: string
        fromUserId:
          description: UUID of the debtor making the payment
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
          format: uuid
          type: string
        toUserId:
          description: UUID of the creditor receiving the payment
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
      required:
        - fromUserId
        - toUserId
        - amount
        - currency
      title: CreateLedgerSettlementPayload
      type: object
    CreateLedgerSettlementRequest:
      additionalProperties: false
      properties:
        groupId:
          description: Group this entry belongs to (optional — omit for user-scoped entries)
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          format: uuid
          type:
            - string
            - "null"
        settlement:
          $ref: "#/components/schemas/CreateLedgerSettlementPayload"
        type:
          enum:
            - SETTLEMENT
          type: string
      required:
        - type
        - settlement
      title: CreateLedgerSettlementRequest
      type: object
    CurrencyBalance:
      properties:
        currency:
          description: ISO 4217 currency code
          example: USD
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
          type: string
        netBalance:
          description: Net balance. Positive = net creditor, negative = net debtor.
          example: 42.75
          multipleOf: 0.0001
          type: number
      required:
        - currency
        - netBalance
      title: CurrencyBalance
      type: object
    CurrencyRatesResponse:
      properties:
        base:
          description: ISO 4217 base currency code used by the provider snapshot
          example: USD
          type: string
        fetchedAt:
          description: Backend fetch/cache timestamp as Unix seconds
          example: 1779124200
          format: int64
          type: integer
        rates:
          additionalProperties:
            type: number
          description: Exchange rates keyed by ISO 4217 currency code
          example:
            EUR: 0.92
            GEL: 2.71
          type: object
        stale:
          description: True when the provider refresh failed and the response came from the last cached snapshot
          example: false
          type: boolean
        timestamp:
          description: Provider snapshot timestamp as Unix seconds
          example: 1779124146
          format: int64
          type: integer
      required:
        - base
        - timestamp
        - fetchedAt
        - stale
        - rates
      title: CurrencyRatesResponse
      type: object
    DashboardBalanceResponse:
      properties:
        balances:
          additionalProperties:
            $ref: "#/components/schemas/CurrencyBalance"
          description: Aggregated balance totals, keyed by currency code
          type: object
      required:
        - balances
      title: DashboardBalanceResponse
      type: object
    DashboardResponse:
      properties:
        activity:
          allOf:
            - $ref: "#/components/schemas/LedgerActivityPreviewFeedResponse"
          description: Latest-state ledger previews across the user's visible group and personal chains
        balances:
          additionalProperties:
            $ref: "#/components/schemas/CurrencyBalance"
          description: Whole balance totals across groups and user-to-user debts, keyed by currency code
          type: object
        groups:
          deprecated: true
          description: Temporary frontend compatibility placeholder. Always empty and scheduled for removal after the frontend migration.
          items: {}
          maxItems: 0
          type: array
      required:
        - balances
        - activity
        - groups
      title: DashboardResponse
      type: object
    ErrorResponse:
      properties:
        code:
          description: |-
            Structured error code. Format: DOMAIN.ERROR_NAME.
            Known codes: AUTH.UNAUTHORIZED, AUTH.FORBIDDEN, AUTH.INVALID_TOKEN,
            AUTH.EXPIRED_TOKEN, AUTH.INVALID_REFRESH_TOKEN, AUTH.INVALID_OAUTH_EXCHANGE_CODE, VALIDATION.INVALID,
            VALIDATION.REQUIRED, VALIDATION.ALREADY_EXISTS, USER.NOT_FOUND,
            USER.FORBIDDEN, USER.CANNOT_JOIN_SELF_INVITE, USER.CANNOT_REMOVE_SELF_FRIEND, USER.OUTSTANDING_DEBT, GROUP.NOT_FOUND, GROUP.FORBIDDEN, GROUP.MEMBER_NOT_FOUND,
            GROUP.CANNOT_KICK_SELF, GROUP.OWNER_MUST_TRANSFER, GROUP.INVALID_NEW_OWNER,
            GROUP.GROUP_INACTIVE, GROUP.INSUFFICIENT_MEMBERS, GROUP.OUTSTANDING_DEBT, GROUP.USER_NOT_CONNECTED, GROUP.ALREADY_MEMBER,
            GROUP.FORMER_MEMBER, GROUP.SIMPLIFY_DEBTS_LOCKED, LEDGER.NOT_FOUND, LEDGER.FORBIDDEN, ACTIVITY.NOT_FOUND,
            COMMENT.NOT_FOUND, COMMENT.FORBIDDEN,
            SYSTEM.INTERNAL, SYSTEM.SERVICE_UNAVAILABLE, SYSTEM.CONFLICT, TEST_RUN.FOREIGN_DATA
          example: VALIDATION.INVALID
          type: string
        details:
          additionalProperties:
            type: string
          description: Optional field-level error details (field name to error message)
          example:
            amount: must be positive
            expense.participantIds: must contain unique users
          type: object
      required:
        - code
      title: ErrorResponse
      type: object
    ExpenseActivityMetadata:
      properties:
        amount:
          description: Expense amount
          example: 85.5
          multipleOf: 0.0001
          type: number
        category:
          description: Normalized lowercase expense category stored for the ledger entry; may be null
          example: food
          type:
            - string
            - "null"
        currency:
          description: Currency code
          example: USD
          type: string
        date:
          description: Business date of the expense at the time of the event (Unix seconds), independent of when the event itself was recorded. Null on activities recorded before this field existed.
          example: 1717200000
          format: int64
          type:
            - integer
            - "null"
        description:
          description: Expense description
          example: Dinner at Luigi's
          type:
            - string
            - "null"
        entryId:
          description: Related ledger entry UUID
          example: e5f6a7b8-c9d0-1234-abcd-567890123456
          format: uuid
          type: string
        fieldDiffs:
          description: Field-level changes for EXPENSE_UPDATED; empty for other expense actions
          items:
            $ref: "#/components/schemas/ActivityFieldDiff"
          type: array
        groupId:
          description: Group UUID (if group-scoped)
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          format: uuid
          type:
            - string
            - "null"
        groupName:
          description: Group name at the time of the event
          example: Weekend Trip
          type:
            - string
            - "null"
        payerDisplayName:
          description: Display name of the payer
          example: Alice Johnson
          type: string
        payerId:
          description: User UUID of the payer
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type:
            - string
            - "null"
        shares:
          description: Snapshot of per-user expense shares at the time the activity was recorded
          items:
            $ref: "#/components/schemas/ExpenseActivityShareMetadata"
          type: array
        sharingMode:
          description: Original validated sharing mode and mode-specific values. Null on activities recorded before this field existed and on EXPENSE_REVERSED.
          oneOf:
            - $ref: "#/components/schemas/SharingMode"
            - type: "null"
        subcategory:
          description: Normalized lowercase expense subcategory stored for the ledger entry; may be null. Null on activities recorded before this field existed.
          example: restaurants
          type:
            - string
            - "null"
        type:
          description: Discriminator value for expense metadata
          enum:
            - expense
          type: string
      required:
        - type
        - entryId
        - amount
        - currency
        - payerDisplayName
      title: ExpenseActivityMetadata
      type: object
    ExpenseActivityShareMetadata:
      properties:
        currency:
          description: Currency code for the share amount
          example: USD
          type: string
        displayName:
          description: Display name of the share holder at the time of the event. Former group members keep the name they had when the activity was recorded. "Unknown" on shares recorded before this field existed.
          example: Bob Smith
          type: string
        shareAmount:
          description: User's share of the expense amount
          example: 42.75
          multipleOf: 0.0001
          type: number
        userId:
          description: User UUID for this expense share
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
          format: uuid
          type: string
      required:
        - userId
        - displayName
        - shareAmount
        - currency
      title: ExpenseActivityShareMetadata
      type: object
    ExpenseTransferActivityMetadata:
      properties:
        actorUserId:
          description: User UUID that triggered the transfer
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
        groupId:
          description: Group UUID where the debt originally lived
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          format: uuid
          type: string
        groupName:
          description: Group name at the time of the transfer
          example: Weekend Trip
          type:
            - string
            - "null"
        reason:
          description: Why the group debt was transferred
          enum:
            - LEAVE
            - KICK
            - GROUP_DELETED
          example: LEAVE
          type: string
        transferredUserId:
          description: User UUID whose group debts were moved out of the group — the member leaving or being removed, or the debtor of the transferred debts when the whole group is deleted
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
          format: uuid
          type: string
        transfers:
          description: Per pair and currency transfer details
          items:
            $ref: "#/components/schemas/ExpenseTransferItemMetadata"
          type: array
        type:
          description: Discriminator value for aggregate transfer metadata
          enum:
            - expense_transfer
          type: string
      required:
        - type
        - groupId
        - transferredUserId
        - actorUserId
        - reason
        - transfers
      title: ExpenseTransferActivityMetadata
      type: object
    ExpenseTransferItemMetadata:
      properties:
        amount:
          description: Transferred debt amount
          example: 42.75
          multipleOf: 0.0001
          type: number
        creditorId:
          description: User UUID of the creditor for the transferred debt
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
        currency:
          description: Currency code
          example: USD
          type: string
