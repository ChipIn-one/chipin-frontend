  /groups/{groupId}/activity-previews:
    get:
      description: |-
        Continues the `recentActivities` page embedded in a group response. Returns active
        ledger chains for this group as `{ parent, lastEvent }`, ordered by the immutable
        `parent.seq`. Reversed chains are removed before the limit is applied.

        Pass `recentActivities.nextCursor` from the matching group as `cursor`. Events created
        before the authenticated user's current membership session are excluded. Personal
        chains are never included in this group-scoped stream.

        Debt transfer events (`EXPENSE_TRANSFERRED_TO`, `EXPENSE_TRANSFERRED_FROM`) are removed
        before the limit as well: they are internal machinery of moving debts out of a group and
        stay readable only through `GET /groups/{groupId}/activities`.
      parameters:
        - deprecated: false
          description: Group UUID from the request path
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
        - deprecated: false
          description: Page size (1–100, default 10). An absent or empty value is treated as omitted; non-empty malformed or out-of-range values return HTTP 400.
          in: query
          name: limit
          required: false
          schema:
            default: 10
