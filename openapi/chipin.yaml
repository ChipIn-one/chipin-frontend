    SharingMode:
      oneOf:
        - additionalProperties: false
          properties:
            type:
              description: |-
                How an expense is split among participants:
                - AUTO: divide equally among all participants
                - EXACT: specify exact amounts per user (must sum to expense total)
                - PERCENTAGE: specify percentage per user (must sum to 100)
                - SHARES: specify relative weights per user (for example 1/1/2)
              enum:
                - AUTO
              type: string
          required:
            - type
          title: SharingMode.AUTO
          type: object
        - additionalProperties: false
          properties:
            customShares:
              additionalProperties:
                minimum: 0
                multipleOf: 0.0001
                type: number
              description: "For EXACT split: userId → amount as a JSON number. Must sum to expense total."
              example:
                a1b2c3d4-e5f6-7890-abcd-ef1234567890: 160
                b2c3d4e5-f6a7-8901-bcde-f12345678901: 80
              minProperties: 1
              type: object
            type:
              description: |-
                How an expense is split among participants:
                - AUTO: divide equally among all participants
                - EXACT: specify exact amounts per user (must sum to expense total)
                - PERCENTAGE: specify percentage per user (must sum to 100)
                - SHARES: specify relative weights per user (for example 1/1/2)
              enum:
                - EXACT
              type: string
          required:
            - type
            - customShares
          title: SharingMode.EXACT
          type: object
        - additionalProperties: false
          properties:
            percentageShares:
              additionalProperties:
                maximum: 100
                minimum: 0
                multipleOf: 0.0001
                type: number
              description: "For PERCENTAGE split: userId → percentage (0–100). Must sum to 100."
              example:
                a1b2c3d4-e5f6-7890-abcd-ef1234567890: 60
                b2c3d4e5-f6a7-8901-bcde-f12345678901: 40
              minProperties: 1
              type: object
            type:
              description: |-
                How an expense is split among participants:
                - AUTO: divide equally among all participants
                - EXACT: specify exact amounts per user (must sum to expense total)
                - PERCENTAGE: specify percentage per user (must sum to 100)
                - SHARES: specify relative weights per user (for example 1/1/2)
              enum:
                - PERCENTAGE
              type: string
          required:
            - type
            - percentageShares
          title: SharingMode.PERCENTAGE
          type: object
        - additionalProperties: false
          properties:
            shares:
              additionalProperties:
                minimum: 0
                multipleOf: 0.0001
                type: number
              description: "For SHARES split: userId → relative weight. Total weight must be positive."
              example:
                a1b2c3d4-e5f6-7890-abcd-ef1234567890: 1
                b2c3d4e5-f6a7-8901-bcde-f12345678901: 1
                d4e5f6a7-b8c9-0123-efab-456789012345: 2
              minProperties: 1
              type: object
            type:
              description: |-
                How an expense is split among participants:
                - AUTO: divide equally among all participants
                - EXACT: specify exact amounts per user (must sum to expense total)
                - PERCENTAGE: specify percentage per user (must sum to 100)
                - SHARES: specify relative weights per user (for example 1/1/2)
              enum:
                - SHARES
              type: string
          required:
            - type
            - shares
          title: SharingMode.SHARES
          type: object
      title: SharingMode
    StatsResponse:
      properties:
        activeGroupsCount:
          description: "Active groups: groups that are active, have at least two active members, and have at least one counted expense created in the last 60 days"
          example: 1800
          format: int64
          type: integer
        debtsTrackedUsd:
          description: "Debts tracked, in USD, as a JSON number with exactly 4 decimals: the shares participants owe the payer in the current version of every counted expense (the payer's own share excluded), converted at current exchange rates. Not netted and not reduced by settlements, so it is neither money moved nor debt currently outstanding."
          example: 1250000.5
          minimum: 0
          multipleOf: 0.0001
          type: number
        expensesCount:
          description: "Expenses split: user-created expenses in groups and between friends that are currently valid. A corrected expense counts once; deleted expenses, system debt-transfer entries and settlements do not count."
          example: 25300000
          format: int64
          type: integer
        peopleSharingCount:
          description: "People sharing: distinct users who hold a share in at least one counted expense. Payers without a share, invited users and group members alone do not count."
          example: 42000
          format: int64
          type: integer
      required:
        - expensesCount
        - debtsTrackedUsd
        - activeGroupsCount
        - peopleSharingCount
      title: StatsResponse
      type: object
