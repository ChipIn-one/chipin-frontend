            settlement:
              type: "null"
            type:
              enum:
                - EXPENSE
              type: string
          required:
            - type
            - expense
          type: object
        - properties:
            expense:
              type: "null"
            settlement:
              $ref: "#/components/schemas/LedgerSettlement"
            type:
              enum:
                - SETTLEMENT
              type: string
          required:
            - type
            - settlement
          type: object
      properties:
        createdAt:
          description: Entry creation timestamp (Unix seconds)
          example: 1717200000
          format: int64
          type: integer
        expense:
          description: Populated when type is EXPENSE, null otherwise
          oneOf:
            - $ref: "#/components/schemas/LedgerExpenseInfo"
            - type: "null"
        groupId:
          description: Group UUID (null for user-scoped entries)
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
          format: uuid
          type:
            - string
            - "null"
        id:
          description: Ledger entry UUID
          example: e5f6a7b8-c9d0-1234-abcd-567890123456
          format: uuid
          type: string
        scope:
          description: |-
            Scope of the entry:
            - GROUP: entry belongs to a specific group
            - USER: entry is a direct user-to-user transaction (no group)
