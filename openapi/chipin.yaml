          example: 6OVU4R0cX5t7JkqkP9r7GfBA2kuMSME5aU0krXplQ0c
          type: string
      required:
        - code
      title: OAuthCodeExchangeRequest
      type: object
    OAuthCodeExchangeResponse:
      properties:
        is_new_user:
          description: True when this OAuth login flow created a new user account
          example: true
          type: boolean
        token:
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhMWIyYzNkNCJ9.access_token
