  /stats:
    get:
      description: Returns cached, aggregate platform counters for the public landing page. The response is shared by every caller and carries no personal data, so it is safe for browsers and CDNs to reuse for the advertised freshness window.
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    expensesCount: 25300000
                    groupsCount: 15000
                    settlementsCount: 320000
                    usersCount: 50000
              schema:
                $ref: "#/components/schemas/StatsResponse"
          description: Current public platform counters
          headers:
            Cache-Control:
              deprecated: false
              description: "Response is reusable by shared caches for 300 seconds. Counters can therefore lag the database by up to twice that: once in the server-side cache and again in the browser or CDN."
              example: public, max-age=300
              required: true
              schema:
                type: string
        "500":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: SYSTEM.INTERNAL
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected server-side failure
      security: []
      summary: Get public platform statistics
      tags:
        - Stats
