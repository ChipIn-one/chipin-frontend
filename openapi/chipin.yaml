    UpdateLedgerEntryRequest:
      discriminator:
        mapping:
          EXPENSE: "#/components/schemas/UpdateLedgerExpenseRequest"
          SETTLEMENT: "#/components/schemas/UpdateLedgerSettlementRequest"
        propertyName: type
      oneOf:
        - $ref: "#/components/schemas/UpdateLedgerExpenseRequest"
        - $ref: "#/components/schemas/UpdateLedgerSettlementRequest"
      title: UpdateLedgerEntryRequest
    UpdateLedgerExpensePayload:
      additionalProperties: false
      anyOf:
        - required:
            - amount
            - participantIds
            - sharingMode
        - not:
            anyOf:
              - required:
                  - amount
              - required:
                  - participantIds
              - required:
                  - sharingMode
      minProperties: 1
      properties:
        amount:
          description: "Replacement amount as a JSON number (max 4 decimal places, must be positive). Part of the split block: send it together with `participantIds` and `sharingMode`."
          example: 92
          exclusiveMinimum: 0
          multipleOf: 0.0001
          type: number
        category:
          description: Replacement category key; send null to clear it. Sending a category without a `subcategory` clears the subcategory, since it belongs to the previous category.
          example: food
          maxLength: 100
          type:
            - string
            - "null"
        currency:
          description: Replacement ISO 4217 currency code (auto-uppercased)
          example: USD
          maxLength: 3
          minLength: 3
          pattern: ^[A-Za-z]{3}$
          type: string
        date:
          description: Replacement expense date as Unix timestamp in seconds
          example: 1717200000
          exclusiveMinimum: 0
          format: int64
          type: integer
        description:
          description: Replacement description; send null to clear it (max 500 characters)
          example: Dinner at Luigi's (updated)
          maxLength: 500
          type:
            - string
            - "null"
        participantIds:
          description: Replacement participant list; part of the split block, so send it together with `amount` and `sharingMode`. The payer need not appear in this list; participants owe the whole amount if the payer is omitted. Must contain at least one user other than the payer. User-scoped expense must involve exactly 2 users total (payer + participants), and the authenticated user must be one of them. Max 50 unique users.
          example:
            - a1b2c3d4-e5f6-7890-abcd-ef1234567890
            - b2c3d4e5-f6a7-8901-bcde-f12345678901
          items:
            format: uuid
            type: string
          maxItems: 50
          minItems: 1
          type: array
          uniqueItems: true
        payerId:
          description: UUID of the user who paid after correction
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
        sharingMode:
          $ref: "#/components/schemas/SharingMode"
        subcategory:
          description: Replacement subcategory key; send null to clear it. Sent without a `category` it is checked against the stored one.
          example: restaurants
          maxLength: 100
          type:
            - string
            - "null"
      title: UpdateLedgerExpensePayload
      type: object
    UpdateLedgerExpenseRequest:
      additionalProperties: false
      properties:
        expense:
          $ref: "#/components/schemas/UpdateLedgerExpensePayload"
        type:
          enum:
            - EXPENSE
          type: string
      required:
        - type
        - expense
      title: UpdateLedgerExpenseRequest
      type: object
    UpdateLedgerSettlementPayload:
      additionalProperties: false
      minProperties: 1
      properties:
        amount:
          description: Updated settlement amount as a JSON number
          example: 50
          exclusiveMinimum: 0
          multipleOf: 0.0001
          type: number
        currency:
          description: Updated ISO 4217 currency code
          example: USD
          maxLength: 3
          minLength: 3
          pattern: ^[A-Za-z]{3}$
          type: string
        note:
          description: Plain-text note (SET-052). Absent keeps the stored note, a nonblank string sets or replaces it, and null, an empty string or a whitespace-only string clears it. At most 500 characters after trimming.
          example: Partial repayment for accommodation
          maxLength: 500
          type:
            - string
            - "null"
        toUserId:
          description: Corrected creditor receiving the payment. The original debtor remains immutable.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
      title: UpdateLedgerSettlementPayload
      type: object
    UpdateLedgerSettlementRequest:
      additionalProperties: false
      properties:
        settlement:
          $ref: "#/components/schemas/UpdateLedgerSettlementPayload"
        type:
          enum:
            - SETTLEMENT
          type: string
      required:
        - type
        - settlement
      title: UpdateLedgerSettlementRequest
      type: object
    UpdateRecurringExpenseRequest:
      properties:
        amount:
          description: New amount of every future booking, with at most 4 decimal places
          exclusiveMinimum: 0
          multipleOf: 0.0001
          type: number
        category:
          description: New expense category key. Null clears it
          type:
            - string
            - "null"
        currency:
          description: New ISO 4217 currency code of every future booking
          maxLength: 3
          minLength: 3
          type:
            - string
            - "null"
        dayOfMonth:
          description: New day of the month for MONTHLY and YEARLY; not allowed for WEEKLY
          maximum: 31
          minimum: 1
          type:
            - integer
            - "null"
        dayOfWeek:
          description: New day of the week for WEEKLY, 1 (Monday) to 7 (Sunday); not allowed otherwise
          maximum: 7
          minimum: 1
          type:
            - integer
            - "null"
        description:
          description: New description of every future booking. Null clears it
          maxLength: 500
          type:
            - string
            - "null"
        endDate:
          description: Null clears it
          format: date
          type:
            - string
            - "null"
        frequency:
          description: A different frequency needs the fields of the new one, as on a create
          enum:
            - MONTHLY
            - WEEKLY
            - YEARLY
          type:
            - string
            - "null"
        monthOfYear:
          description: New month for YEARLY; not allowed otherwise
          maximum: 12
          minimum: 1
          type:
            - integer
            - "null"
        occurrenceLimit:
          description: Null clears it
          minimum: 1
          type:
            - integer
            - "null"
        participantIds:
          description: Replaces the users who share the cost
          items:
            type: string
          type:
            - array
            - "null"
        sharingMode:
          description: Replaces the split. Null sets AUTO (equally)
          oneOf:
            - $ref: "#/components/schemas/SharingMode"
            - type: "null"
        subcategory:
          description: New expense subcategory key; it must belong to the category. Null clears it
          type:
            - string
            - "null"
      title: UpdateRecurringExpenseRequest
      type: object
    UpdateSelfUserRequest:
      properties:
        displayName:
          description: New display name. Trimmed before validation.
          example: Alice Johnson
          maxLength: 64
          minLength: 1
          type: string
        settings:
          $ref: "#/components/schemas/UpdateUserSettingsRequest"
      title: UpdateSelfUserRequest
      type: object
    UpdateUserSettingsRequest:
      properties:
        defaultCategory:
          description: Trimmed before validation, compared case-insensitively, and stored lowercase.
          example: food
          pattern: ^([Ff][Oo][Oo][Dd]|[Tt][Rr][Aa][Nn][Ss][Pp][Oo][Rr][Tt]|[Hh][Oo][Uu][Ss][Ii][Nn][Gg]|[Dd][Ii][Gg][Ii][Tt][Aa][Ll]|[Ss][Hh][Oo][Pp][Pp][Ii][Nn][Gg]|[Ll][Ii][Ff][Ee][Ss][Tt][Yy][Ll][Ee]|[Pp][Ee][Rr][Ss][Oo][Nn][Aa][Ll]_[Cc][Aa][Rr][Ee]|[Ss][Pp][Oo][Rr][Tt][Ss]|[Hh][Ee][Aa][Ll][Tt][Hh]|[Tt][Rr][Aa][Vv][Ee][Ll]|[Ee][Dd][Uu][Cc][Aa][Tt][Ii][Oo][Nn]|[Ff][Ii][Nn][Aa][Nn][Cc][Ee]|[Pp][Ee][Tt][Ss]|[Oo][Tt][Hh][Ee][Rr])$
          type: string
        defaultCurrency:
          description: ISO 4217 currency code; accepted case-insensitively and stored uppercase
          example: eur
          maxLength: 3
          minLength: 3
          pattern: ^[A-Za-z]{3}$
          type: string
        language:
          description: Frontend-controlled language tag; no strict backend validation.
          example: pt-br
          type: string
        saveGroupExpensesToSolo:
          example: false
          type: boolean
        sex:
          description: Trimmed before validation, compared case-insensitively, and stored lowercase. Every value GET can return is writable, so a GET response may be echoed back unchanged. An unknown value is rejected with a `sex` validation error, and validation rejects the whole request on one bad field, including unrelated field changes.
          example: male
          pattern: ^([Mm][Aa][Ll][Ee]|[Ff][Ee][Mm][Aa][Ll][Ee])$
          type: string
        simplifyDebts:
          description: Default preference for simplifying debts in future group-related flows.
          example: false
          type: boolean
        skipCategory:
          example: true
          type: boolean
        soloModeByDefault:
          example: true
          type: boolean
        theme:
          description: Frontend-controlled theme string.
          example: DARK
          type: string
        timeFormat:
          description: Preferred clock format
          enum:
            - 12h
            - 24h
          example: 24h
          type: string
      title: UpdateUserSettingsRequest
      type: object
    UpsertActivityCommentRequest:
      properties:
        text:
          description: Comment text; surrounding whitespace is removed before persistence
          example: Please attach the receipt
          maxLength: 2000
          minLength: 1
          type: string
      required:
        - text
      title: UpsertActivityCommentRequest
      type: object
    User:
      properties:
        createdAt:
          description: Account creation timestamp in Unix seconds
          example: 1717200000
          format: int64
          type: integer
        displayName:
          description: User's display name shown in the UI
          example: Alice Johnson
          type: string
        email:
          description: User's email address (from OAuth provider)
          example: alice@example.com
          format: email
          type: string
        firstName:
          description: User's first name (may be null if not provided by OAuth)
          example: Alice
          type:
            - string
            - "null"
        id:
          description: Unique user identifier
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          format: uuid
          type: string
        lastName:
          description: User's last name (may be null if not provided by OAuth)
          example: Johnson
          type:
            - string
            - "null"
        picture:
          description: URL to user's profile picture (typically from Google)
          example: https://lh3.googleusercontent.com/a/photo-hash
          format: uri
          type:
            - string
            - "null"
        updatedAt:
          description: Last profile update timestamp in Unix seconds
          example: 1717200000
          format: int64
          type: integer
      required:
        - id
        - email
        - displayName
        - createdAt
        - updatedAt
      title: User
      type: object
    UserBalanceResponse:
      properties:
        balancesByCurrency:
          additionalProperties:
            $ref: "#/components/schemas/CurrencyBalance"
          description: Aggregated net balances per currency
          type: object
        counterpartyDebtsByCurrency:
          additionalProperties:
            items:
              $ref: "#/components/schemas/CounterpartyDebt"
            type: array
          description: Debts with each counterparty, keyed by currency code
          type: object
        generatedAt:
          description: Timestamp when these balances were computed (Unix seconds)
          example: 1717200000
          format: int64
          type: integer
        userId:
          description: The user these balances are for
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
          format: uuid
          type: string
      required:
        - userId
        - counterpartyDebtsByCurrency
        - balancesByCurrency
        - generatedAt
      title: UserBalanceResponse
      type: object
    UserInviteLinkResponse:
      properties:
        inviteToken:
          description: Token for creating a known-user relationship through /users/invite/{inviteToken}
          example: AbCdEfGhIjKlMnOpQrStUvWxYz012345
          maxLength: 32
          minLength: 32
          pattern: ^[A-Za-z0-9_-]{32}$
          type: string
      required:
        - inviteToken
      title: UserInviteLinkResponse
      type: object
    UserInvitePreviewInviter:
      description: Owner of the invite token
      properties:
        avatarUrl:
          description: Avatar image URL of the inviter, or null when there is none
          type:
            - string
            - "null"
        displayName:
          description: Display name of the inviter
          type: string
      required:
        - displayName
        - avatarUrl
      title: UserInvitePreviewInviter
      type: object
    UserInvitePreviewResponse:
      properties:
        inviter:
          $ref: "#/components/schemas/UserInvitePreviewInviter"
        isAlreadyFriend:
          description: Whether the caller and the inviter are already known users; accepting would change nothing
          type: boolean
      required:
        - inviter
        - isAlreadyFriend
      title: UserInvitePreviewResponse
      type: object
    UserSettings:
      properties:
        defaultCategory:
          description: Default category pre-selected for new expenses.
          enum:
            - food
            - transport
            - housing
            - digital
            - shopping
            - lifestyle
            - personal_care
            - sports
            - health
            - travel
            - education
            - finance
            - pets
            - other
          example: other
          type: string
        defaultCurrency:
          description: Default ISO 4217 currency code for new user actions
          example: USD
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
          type: string
        language:
          description: Frontend-controlled language tag; no strict backend validation.
          example: pt-br
          type: string
        saveGroupExpensesToSolo:
          description: Client preference for also recording group expenses in Solo records.
          example: true
          type: boolean
        sex:
          description: User sex. Defaults to `male` for users who never chose one, so this value does not distinguish an explicit choice from the default.
          enum:
            - male
            - female
          example: male
          type: string
        simplifyDebts:
          description: Default preference for simplifying debts in future group-related flows.
          example: true
          type: boolean
        skipCategory:
          description: Client preference for skipping the category step when creating an expense.
          example: false
          type: boolean
        soloModeByDefault:
          description: Client preference for starting new expenses in Solo Mode.
          example: false
          type: boolean
        theme:
          description: Frontend-controlled theme string.
          example: SYSTEM
          type: string
        timeFormat:
          description: Preferred clock format
          enum:
            - 12h
            - 24h
          example: 24h
          type: string
      required:
        - defaultCurrency
        - timeFormat
        - language
        - theme
        - simplifyDebts
        - defaultCategory
        - skipCategory
        - soloModeByDefault
        - saveGroupExpensesToSolo
        - sex
      title: UserSettings
      type: object
  securitySchemes:
    basicAuth:
      description: HTTP Basic authentication for staging-only test endpoints
      scheme: basic
      type: http
    bearerAuth:
      bearerFormat: JWT
      description: JWT access token obtained via /auth/login/* endpoints
      scheme: bearer
      type: http
info:
  contact: {}
  description: |-
    Expense-splitting backend API for managing shared expenses and settlements between users.
    All monetary amounts are represented as JSON numbers with up to 4 decimal places (e.g. 85.5000).
    All timestamps are Unix timestamps in seconds unless otherwise noted.
  title: Chipin API
  version: 1.0.0-30-ga308a90
openapi: 3.1.1
paths:
  /auth/login/google:
    get:
      description: |-
        Initiates the Google OAuth2 login flow. Redirects the browser to Google's
        consent page. After successful authentication, Google redirects back to the
        callback URL with an authorization code. The required `redirect_to` URL must
        use a frontend origin allowed by the server.
      parameters:
        - deprecated: false
          description: Allowed frontend URL that receives the one-time OAuth exchange code
          example: https://app.chipin.one/oauth/callback
          in: query
          name: redirect_to
          required: true
          schema:
            format: uri
            type: string
        - deprecated: false
          description: "Registration language for a user this login creates: en or ru (case-insensitive). Anything else, or nothing, means en and never rejects the login. Ignored for an existing user."
          example: ru
          in: query
          name: locale
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to Google OAuth consent page
          headers:
            Set-Cookie:
              deprecated: false
              description: "AUTH-015: the browser binding of this login, set only when `redirect_to` is accepted. `Max-Age` equals the login state lifetime (`redis.ttlForOauthState`, 10 minutes by default). A new login in the same browser replaces it."
              example: __Host-chipin_oauth_tx=q3Z8yJvH1c2Wm0bT9XrLkP4sNfA7eD6gU5hRiOoYw0E; Max-Age=600; Path=/; Secure; HttpOnly; SameSite=Lax
              required: false
              schema:
                type: string
        "400":
          content:
            application/json:
              examples:
                field_validation:
                  summary: Field-level validation error
                  value:
                    code: VALIDATION.INVALID
                    details:
                      amount: must be positive
                      expense.participantIds: must contain at least one user other than the payer
                uuid_validation:
                  summary: Invalid UUID format
                  value:
                    code: VALIDATION.INVALID
                    details:
                      groupId: must be a valid UUID
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
      security: []
      summary: Google OAuth login redirect
      tags:
        - Auth
  /auth/logout:
    post:
      description: |-
        Ends the session whose refresh token is in the `__Host-chipin_refresh` cookie and clears the
        cookie. No Bearer access token is required, so a client whose access token has expired can
        still sign out. A missing or already invalid cookie still succeeds. The access token itself is
        not revoked and stays valid until it expires; discard it on the client.

        Logout is session-scoped: other devices/sessions remain active.
      parameters:
        - deprecated: false
          description: Refresh token of the session to end
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
          in: cookie
          name: __Host-chipin_refresh
          required: false
          schema:
            type: string
        - deprecated: false
          description: Any non-blank value. Required on every endpoint that reads the refresh-token cookie; requests without it are rejected with 400 before any state changes.
          example: "1"
          in: header
          name: X-Chipin-Csrf
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Logged out; the cookie is cleared. No response body is returned.
          headers:
            Set-Cookie:
              deprecated: false
              description: Clears the refresh-token cookie (`Max-Age=0`)
              example: __Host-chipin_refresh=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Strict
              required: false
              schema:
                type: string
        "400":
          content:
            application/json:
              examples:
                field_validation:
                  summary: Field-level validation error
                  value:
                    code: VALIDATION.INVALID
                    details:
                      amount: must be positive
                      expense.participantIds: must contain at least one user other than the payer
                uuid_validation:
                  summary: Invalid UUID format
                  value:
                    code: VALIDATION.INVALID
                    details:
                      groupId: must be a valid UUID
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
      security: []
      summary: Logout current session
      tags:
        - Auth
  /auth/logout-other-devices:
    post:
      description: |-
        Rotates the authenticated user's token version so access and refresh tokens from other
        devices stop working. The caller receives a new access token in the body and a new refresh
        token in the `__Host-chipin_refresh` cookie; the client must replace its in-memory access token.
        A missing, foreign or stale cookie is refused with no `Set-Cookie`. A foreign or stale cookie
        still ends the session it names: that session is consumed before the owner and version checks
        (AUTH-043 deviation), so the cookie stops working as well.

        This endpoint does not return revoked token details, affected device lists, revocation
        counts, or revocation timestamps.
      parameters:
        - deprecated: false
          description: Current session refresh token; must belong to the authenticated user.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
          in: cookie
          name: __Host-chipin_refresh
          required: true
          schema:
            type: string
        - deprecated: false
          description: Any non-blank value. Required on every endpoint that reads the refresh-token cookie; requests without it are rejected with 400 before any state changes.
          example: "1"
          in: header
          name: X-Chipin-Csrf
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhMWIyYzNkNCJ9.rotated_access_token
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
          description: New access token for the current device; the new refresh token is set in the cookie
          headers:
            Set-Cookie:
              deprecated: false
              description: Refresh token of the current device at the new token version. `Max-Age` equals the refresh-token lifetime (`jwt.refreshTokenTtlSeconds`, 30 days by default), so the browser forgets the cookie when the session expires.
              example: __Host-chipin_refresh=d290f1ee-6c54-4b01-90e6-d701748f0851; Max-Age=2592000; Path=/; Secure; HttpOnly; SameSite=Strict
              required: false
              schema:
                type: string
        "400":
          content:
            application/json:
              examples:
                field_validation:
                  summary: Field-level validation error
                  value:
                    code: VALIDATION.INVALID
                    details:
                      amount: must be positive
                      expense.participantIds: must contain at least one user other than the payer
                uuid_validation:
                  summary: Invalid UUID format
                  value:
                    code: VALIDATION.INVALID
                    details:
                      groupId: must be a valid UUID
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed
        "401":
          content:
            application/json:
              examples:
                invalid_refresh_token:
                  value:
                    code: AUTH.INVALID_REFRESH_TOKEN
                unauthorized:
                  value:
                    code: AUTH.UNAUTHORIZED
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Missing or invalid JWT token, or the refresh-token cookie is missing, invalid, expired, or revoked
        "404":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: USER.NOT_FOUND
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: User not found
      security:
        - bearerAuth: []
      summary: Logout other devices
      tags:
        - Auth
  /auth/oauth/google/exchange:
    post:
      description: |-
        Exchanges a short-lived backend OAuth login code for an access token and a flag indicating
        whether this OAuth flow created a new user account. The refresh token is set in the
        `__Host-chipin_refresh` HttpOnly cookie and never appears in the body.
      parameters:
        - deprecated: false
          description: "AUTH-016: the browser binding set by `GET /auth/login/google` of the same login. The browser sends it on its own on the same-origin POST. Without it the exchange answers 400 `AUTH.OAUTH_BROWSER_BINDING_REQUIRED` and the code stays usable; with another login's value it answers 401 and the code is spent."
          example: q3Z8yJvH1c2Wm0bT9XrLkP4sNfA7eD6gU5hRiOoYw0E
          in: cookie
          name: __Host-chipin_oauth_tx
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  code: 6OVU4R0cX5t7JkqkP9r7GfBA2kuMSME5aU0krXplQ0c
            schema:
              $ref: "#/components/schemas/OAuthCodeExchangeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    is_new_user: true
                    token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhMWIyYzNkNCJ9.signature
              schema:
                $ref: "#/components/schemas/OAuthCodeExchangeResponse"
          description: OAuth token exchange result
          headers:
            Set-Cookie:
              deprecated: false
              description: "Refresh token of the new session. `__Host-chipin_oauth_tx` is left as it is (AUTH-017): it expires with its `Max-Age`. `Max-Age` equals the refresh-token lifetime (`jwt.refreshTokenTtlSeconds`, 30 days by default), so the browser forgets the cookie when the session expires."
              example: __Host-chipin_refresh=d290f1ee-6c54-4b01-90e6-d701748f0851; Max-Age=2592000; Path=/; Secure; HttpOnly; SameSite=Strict
              required: false
              schema:
                type: string
        "400":
          content:
            application/json:
              examples:
                field_validation:
                  summary: Field-level validation error
                  value:
                    code: VALIDATION.INVALID
                    details:
                      amount: must be positive
                      expense.participantIds: must contain at least one user other than the payer
                oauth_browser_binding_required:
                  summary: "AUTH-016: no __Host-chipin_oauth_tx cookie; the code was not consumed"
                  value:
                    code: AUTH.OAUTH_BROWSER_BINDING_REQUIRED
                uuid_validation:
                  summary: Invalid UUID format
                  value:
                    code: VALIDATION.INVALID
                    details:
                      groupId: must be a valid UUID
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Validation failed, or the browser that started this login did not present its binding cookie
        "401":
          content:
            application/json:
              examples:
                default:
                  value:
                    code: AUTH.INVALID_OAUTH_EXCHANGE_CODE
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: OAuth exchange code is invalid, expired, or already used
      security: []
      summary: Exchange OAuth login code
      tags:
        - Auth
  /auth/refresh:
    post:
      description: |-
        Rotates the refresh token held in the `__Host-chipin_refresh` HttpOnly cookie and returns a new
        access token. The presented refresh token is atomically invalidated and its replacement is set
        in the same cookie. No Bearer access token is required. A failed refresh does not modify the
        cookie; a missing cookie is refused like an invalid one.
      parameters:
        - deprecated: false
          description: Current refresh token
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
          in: cookie
          name: __Host-chipin_refresh
          required: true
          schema:
            type: string
        - deprecated: false
          description: Any non-blank value. Required on every endpoint that reads the refresh-token cookie; requests without it are rejected with 400 before any state changes.
          example: "1"
          in: header
          name: X-Chipin-Csrf
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              examples:
                default:
                  value:
                    token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhMWIyYzNkNCJ9.new_signature
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
