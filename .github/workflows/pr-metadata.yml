name: Frontend PR metadata

on:
  pull_request:
    branches: [master]
    # No ready_for_review: Frontend CI runs on it, and its completed workflow_run below reconciles the
    # PR (chipin-frontend#792).
    types: [opened, reopened, edited, synchronize]
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing FE PR to reconcile
        required: true
        type: string
      head_sha:
        description: Exact current PR head SHA
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: read

# The only FE workflow that writes the Development link and PR metadata: the action reconciles the native link itself,
# so there is no separate Native Development link workflow (chipin-frontend#760). One group per PR
# serialises the pull_request, workflow_run and dispatch runs.
concurrency:
  group: pr-metadata-${{ github.repository }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0].number != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile trusted PR metadata without checking out PR code
        uses: ChipIn-one/.github/automation/pr-metadata-action@5a58d05dde71164eb97aba9f9717efa949266d9a # v1.17.0
        with:
          pull-request-number: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.head_sha }}
          token: ${{ github.token }}
          admission-token: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
