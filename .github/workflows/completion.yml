# Completion caller for completion: deployment-receipt, copied from the org template
# ChipIn-one/.github templates/caller-completion-deployment-receipt.yml (registry: `completion: deployment-receipt` +
# `productionEvidence: { environment: Production, creator: vercel[bot] }`, chipin-frontend#497).
# Triggers (docs/workflow/completion.md, deployment-receipt):
# - deployment_status: a production receipt arrived. Vercel is expected to write the `Production` success status when
#   a `master` deployment is promoted; this is verified at cutover step 7 of chipin-frontend#497, and until then FE
#   completion stays manual (registry `capabilities.completion: manual`). The job runs only for state success in the registry environment; previews, pending and failed statuses
#   start nothing. The engine re-validates every receipt itself (environment, creator, newest status, SHA on the branch).
# - push to the integration branch: a linked PR merged; the Issue moves Todo / In Progress -> Awaiting release.
# - workflow_dispatch: manual rerun; the engine takes no input and reads the registry pinned in the action.
# - The org sweep in ChipIn-one/.github (schedule) stays the fallback for missed events. A deployment_status run uses
#   the workflow file at the deployment's SHA, so receipts for commits made before this caller existed start no run;
#   the org sweep covers them.
# awaiting-release "true" needs an organization token (here the org secret CHIPIN_ISSUE_WRITE_TOKEN, made available
# to the repository by the owner) with Deployments read, Issues write and Project #5 read/write. Without it use
# `github.token` and awaiting-release "false", and widen `permissions` below to deployments: read, issues: write,
# pull-requests: read: the close still works, Awaiting release then comes from the org sweep.
name: Completion
on:
  deployment_status:
  push:
    branches: [master]          # branches.integration from workflow-registry.yaml
  workflow_dispatch:
permissions:
  contents: read                # GITHUB_TOKEN is not used: the PAT carries the Deployments, Issues and Project #5 access
concurrency:
  # one run at a time, a running sweep is never cancelled; GitHub keeps one pending run per group and cancels an
  # older pending one, which is harmless because every run sweeps all open Issues
  group: completion-${{ github.repository }}
  cancel-in-progress: false
jobs:
  completion:
    # productionEvidence.environment from workflow-registry.yaml
    if: >-
      github.repository_owner == 'ChipIn-one' &&
      (github.event_name != 'deployment_status' ||
       (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TODO repin to the release tag of ChipIn-one/.github#213 before this caller is merged
      - uses: ChipIn-one/.github/automation/completion-action@7f6f401e6955e3c2bc1e5a277fcdde528079f830
        with:
          token: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
          awaiting-release: "true"
