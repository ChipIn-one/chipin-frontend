name: Read frontend release QA result

on:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read

concurrency:
  group: release-qa-result-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: true

jobs:
  read-result:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch result reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # The script returns a Slack line only after validating a result from the sole assigned QA.
      - name: Validate current Issue and comment
        id: result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
        run: node scripts/release-qa-result.mjs
      # The shared org action holds the webhook alone; it never fails the job (result sent|skipped|failed).
      - name: Post to Slack
        id: slack
        if: steps.result.outputs.slack_post == 'true'
        continue-on-error: true
        uses: ChipIn-one/.github/automation/slack-notify-action@6a619d677a315e6dd145b68148634dcab8af8bea # v1.15.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_FE_RELEASES }}
          text: ${{ steps.result.outputs.slack_text }}
          timeout-seconds: '10'
      - name: Warn when Slack was not posted
        if: steps.result.outputs.slack_post == 'true' && steps.slack.outputs.result != 'sent'
        env:
          RESULT: ${{ steps.slack.outputs.result }}
          FAILURE: ${{ steps.result.outputs.slack_failure }}
        run: |
          if [ "$RESULT" = "skipped" ]; then
            echo "::warning::SLACK_WEBHOOK_FE_RELEASES is not configured; nothing was posted."
          else
            echo "::warning::$FAILURE"
          fi
