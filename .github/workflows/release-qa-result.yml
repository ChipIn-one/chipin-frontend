name: Read frontend release QA result

on:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read

concurrency:
  group: release-qa-result-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: true

jobs:
  read-result:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch result reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # Slack is posted by the script only after validating a result from the sole assigned QA.
      - name: Validate current Issue and comment, then ping Slack
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_CI: ${{ secrets.SLACK_WEBHOOK_CI }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
        run: node scripts/release-qa-result.mjs
