name: Main CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-ci:
    name: main-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verified source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate release source
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/release-source-policy.mjs
      # Implementation PRs use Task identity; dev->main releases use the shared
      # Included Issues inventory (each Issue admitted separately). No release bypass.
      - name: Require canonical Issue admission for PR
        if: github.event_name == 'pull_request'
        uses: ChipIn-one/.github/automation/issue-admission-action@7793b4c46b1afcfc18e85d48fa4963d671725fbe
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
      - name: Resolve verification mode
        id: gate
        env:
          CHIPIN_CI_WORKFLOW: main-ci
          CHIPIN_TARGET_BRANCH: main
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mode="full"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            mode="$(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-gate-policy.mjs)"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.gate.outputs.mode == 'full'
        run: npm ci
      - name: Verify current main-compatible frontend
        if: steps.gate.outputs.mode == 'full'
        run: npm run verify:full
      - name: Record docs-only required-check path
        if: steps.gate.outputs.mode == 'docs-only'
        run: echo "main-ci completed via docs-only path; verify:full was not required for this event."
