name: Main CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-ci:
    name: main-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate release source
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-source-policy.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify current main-compatible frontend
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.["verify:full"] ? 0 : 1)'; then
            npm run verify:full
          else
            npm run lint
            npm run build
          fi
