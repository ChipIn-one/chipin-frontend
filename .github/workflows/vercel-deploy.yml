name: Vercel Deploy

on:
  workflow_run:
    workflows:
      - Frontend CI
      - Main CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: vercel-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy-${{ github.event.workflow_run.head_branch }}
    if: >-
      ${{
        vars.VERCEL_ACTIONS_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          (
            github.event.workflow_run.name == 'Frontend CI' &&
            github.event.workflow_run.head_branch == 'dev'
          ) ||
          (
            github.event.workflow_run.name == 'Main CI' &&
            github.event.workflow_run.head_branch == 'main'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify branch freshness and trigger Vercel Deploy Hook
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CI_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          VERCEL_DEV_DEPLOY_HOOK: ${{ secrets.VERCEL_DEV_DEPLOY_HOOK }}
          VERCEL_PROD_DEPLOY_HOOK: ${{ secrets.VERCEL_PROD_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -euo pipefail

          case "$CI_WORKFLOW:$SOURCE_BRANCH" in
            "Frontend CI:dev")
              deploy_hook="$VERCEL_DEV_DEPLOY_HOOK"
              environment="Preview"
              ;;
            "Main CI:main")
              deploy_hook="$VERCEL_PROD_DEPLOY_HOOK"
              environment="Production"
              ;;
            *)
              echo "Unsupported CI/branch deployment combination."
              exit 1
              ;;
          esac

          if [ -z "$deploy_hook" ]; then
            echo "Missing Vercel Deploy Hook secret for $SOURCE_BRANCH."
            exit 1
          fi

          encoded_branch="$(jq -rn --arg value "$SOURCE_BRANCH" '$value|@uri')"
          current_sha="$(gh api "/repos/$REPOSITORY/branches/$encoded_branch" --jq '.commit.sha')"

          if [ "$current_sha" != "$CI_SHA" ]; then
            echo "Skipping stale deployment: $SOURCE_BRANCH moved from $CI_SHA to $current_sha."
            echo "Vercel deploy skipped because the branch advanced after this CI run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          response="$(curl --fail-with-body --silent --show-error --request POST "$deploy_hook")"

          echo "Vercel Deploy Hook accepted for $SOURCE_BRANCH." >> "$GITHUB_STEP_SUMMARY"
          echo "Environment: $environment" >> "$GITHUB_STEP_SUMMARY"
          echo "CI SHA checked immediately before trigger: $CI_SHA" >> "$GITHUB_STEP_SUMMARY"

          job_id="$(jq -r '.job.id // empty' <<<"$response")"
          if [ -n "$job_id" ]; then
            echo "Vercel job: $job_id" >> "$GITHUB_STEP_SUMMARY"
          fi
