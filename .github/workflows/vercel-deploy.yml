name: Vercel Deploy

on:
  workflow_run:
    workflows:
      - Frontend CI
      - Main CI
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vercel-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 59.19.1

jobs:
  resolve:
    name: resolve-deployment
    if: >-
      ${{
        vars.VERCEL_ACTIONS_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (
          (
            github.event.workflow_run.name == 'Frontend CI' &&
            (
              (
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_branch == 'dev'
              ) ||
              (
                github.event.workflow_run.event == 'pull_request' &&
                github.event.workflow_run.pull_requests[0].base.ref == 'dev'
              )
            )
          ) ||
          (
            github.event.workflow_run.name == 'Main CI' &&
            (
              (
                github.event.workflow_run.event == 'push' &&
                github.event.workflow_run.head_branch == 'main'
              ) ||
              (
                github.event.workflow_run.event == 'pull_request' &&
                github.event.workflow_run.pull_requests[0].base.ref == 'main' &&
                github.event.workflow_run.head_branch == 'dev'
              )
            )
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      base_ref: ${{ steps.policy.outputs.base_ref }}
      ci_sha: ${{ steps.policy.outputs.ci_sha }}
      event_name: ${{ steps.policy.outputs.event_name }}
      pr_number: ${{ steps.policy.outputs.pr_number }}
      source_branch: ${{ steps.policy.outputs.source_branch }}
      source_repository: ${{ steps.policy.outputs.source_repository }}
      target: ${{ steps.policy.outputs.target }}
    steps:
      - name: Checkout trusted deployment policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Resolve and verify CI provenance
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_ENABLED: ${{ vars.VERCEL_ACTIONS_DEPLOY_ENABLED }}
          CI_RESULT: ${{ github.event.workflow_run.conclusion }}
          CI_WORKFLOW: ${{ github.event.workflow_run.name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
          BASE_REF: ${{ github.event.workflow_run.pull_requests[0].base.ref }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail

          current_source_repository="$REPOSITORY"
          current_source_branch="$SOURCE_BRANCH"
          current_base_ref="$BASE_REF"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "Pull request number is required for a PR deployment."
              exit 1
            fi

            pr_json="$(gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER")"
            current_source_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
            current_source_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            current_source_branch="$(jq -r '.head.ref // ""' <<<"$pr_json")"
            current_base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"
          else
            encoded_branch="$(jq -rn --arg value "$SOURCE_BRANCH" '$value|@uri')"
            current_source_sha="$(gh api "/repos/$REPOSITORY/branches/$encoded_branch" --jq '.commit.sha')"
            current_base_ref=""
          fi

          CHIPIN_VERCEL_DEPLOY_ENABLED="$ACTIVATION_ENABLED" \
          CHIPIN_CI_RESULT="$CI_RESULT" \
          CHIPIN_CI_WORKFLOW="$CI_WORKFLOW" \
          CHIPIN_REPOSITORY="$REPOSITORY" \
          CHIPIN_SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
          CHIPIN_CURRENT_SOURCE_REPOSITORY="$current_source_repository" \
          CHIPIN_EVENT_NAME="$EVENT_NAME" \
          CHIPIN_BASE_REF="$BASE_REF" \
          CHIPIN_CURRENT_BASE_REF="$current_base_ref" \
          CHIPIN_SOURCE_BRANCH="$SOURCE_BRANCH" \
          CHIPIN_CURRENT_SOURCE_BRANCH="$current_source_branch" \
          CHIPIN_CI_SHA="$CI_SHA" \
          CHIPIN_CURRENT_SOURCE_SHA="$current_source_sha" \
            node control/scripts/vercel-deploy-policy.mjs >> "$GITHUB_OUTPUT"

          {
            echo "base_ref=$BASE_REF"
            echo "event_name=$EVENT_NAME"
            echo "pr_number=$PR_NUMBER"
            echo "source_repository=$SOURCE_REPOSITORY"
          } >> "$GITHUB_OUTPUT"

  prepare-preview:
    name: prepare-preview-settings
    needs: resolve
    if: needs.resolve.outputs.target == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --prefix "$RUNNER_TEMP/vercel-cli" \
            --no-audit \
            --no-fund \
            "vercel@$VERCEL_CLI_VERSION"
      - name: Pull preview settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.source_branch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p settings
          cd settings
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" pull \
            --yes \
            --environment=preview \
            --git-branch="$SOURCE_BRANCH" \
            --token="$VERCEL_TOKEN"
      - name: Remove credentials from preview build settings
        shell: bash
        run: |
          set -euo pipefail
          env_file="settings/.vercel/.env.preview.local"
          test -f "settings/.vercel/project.json"
          test -f "$env_file"

          awk '/^VITE_[A-Za-z0-9_]*=/' "$env_file" > "$RUNNER_TEMP/public-preview.env"
          mv "$RUNNER_TEMP/public-preview.env" "$env_file"

          if grep -Ev '^(VITE_[A-Za-z0-9_]*=|[[:space:]]*$|#)' "$env_file"; then
            echo "Preview build settings contain a non-public variable."
            exit 1
          fi

          tar -C settings -czf "$RUNNER_TEMP/vercel-preview-settings.tgz" \
            .vercel/project.json \
            .vercel/.env.preview.local
      - name: Upload sanitized preview settings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vercel-preview-settings-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-preview-settings.tgz
          if-no-files-found: error
          retention-days: 1

  build-preview:
    name: build-preview
    needs:
      - resolve
      - prepare-preview
    if: needs.resolve.outputs.target == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact CI SHA without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.ci_sha }}
          path: source
          persist-credentials: false
      - name: Verify checked-out SHA
        env:
          CI_SHA: ${{ needs.resolve.outputs.ci_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$CI_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install source dependencies without deployment credentials
        working-directory: source
        run: npm ci
      - name: Download sanitized preview settings
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: vercel-preview-settings-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-settings
      - name: Restore public preview variables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-preview"
          tar -C "$RUNNER_TEMP/public-preview" \
            -xzf "$RUNNER_TEMP/preview-settings/vercel-preview-settings.tgz" \
            .vercel/.env.preview.local
          cp "$RUNNER_TEMP/public-preview/.vercel/.env.preview.local" source/.env.local
      - name: Build static preview without deployment credentials
        working-directory: source
        env:
          VERCEL: '1'
          VERCEL_ENV: preview
          CHIPIN_TASK_BRANCH: ${{ needs.resolve.outputs.source_branch }}
          CHIPIN_TASK_HEAD_SHA: ${{ needs.resolve.outputs.ci_sha }}
          CHIPIN_UNTRUSTED_PREVIEW_BUILD: '1'
        run: npm run vercel-build
      - name: Validate and package static preview
        env:
          CI_SHA: ${{ needs.resolve.outputs.ci_sha }}
        shell: bash
        run: |
          set -euo pipefail

          test -d source/dist

          if find source/dist ! -type f ! -type d -print -quit | grep -q .; then
            echo "Preview dist contains an unsupported filesystem object."
            exit 1
          fi

          if find source/dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Untrusted preview dist must not contain source maps."
            exit 1
          fi

          printf '%s\n' "$CI_SHA" > source/verified-ci-sha
          tar -C source -czf "$RUNNER_TEMP/vercel-preview-static.tgz" \
            dist \
            verified-ci-sha
      - name: Upload static preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vercel-preview-static-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-preview-static.tgz
          if-no-files-found: error
          retention-days: 1

  deploy-preview:
    name: deploy-preview
    needs:
      - resolve
      - prepare-preview
      - build-preview
    if: needs.resolve.outputs.target == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Download trusted preview settings
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: vercel-preview-settings-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-settings
      - name: Download static preview artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: vercel-preview-static-${{ github.run_id }}
          path: ${{ runner.temp }}/preview-static
      - name: Restore trusted settings and static artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -C control -xzf "$RUNNER_TEMP/preview-settings/vercel-preview-settings.tgz"
          mkdir -p artifact
          tar -C artifact -xzf "$RUNNER_TEMP/preview-static/vercel-preview-static.tgz"

          test -f control/.vercel/project.json
          test -f control/.vercel/.env.preview.local
          test -d artifact/dist
          test -f artifact/verified-ci-sha

          if find artifact/dist ! -type f ! -type d -print -quit | grep -q .; then
            echo "Preview dist contains an unsupported filesystem object."
            exit 1
          fi

          if find artifact/dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Untrusted preview dist must not contain source maps."
            exit 1
          fi
      - name: Recheck preview freshness
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_ENABLED: ${{ vars.VERCEL_ACTIONS_DEPLOY_ENABLED }}
          CI_RESULT: ${{ github.event.workflow_run.conclusion }}
          CI_WORKFLOW: ${{ github.event.workflow_run.name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
          EVENT_NAME: ${{ needs.resolve.outputs.event_name }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.source_branch }}
          CI_SHA: ${{ needs.resolve.outputs.ci_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current_source_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
          current_source_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          current_source_branch="$(jq -r '.head.ref // ""' <<<"$pr_json")"
          current_base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"
          verified_artifact_sha="$(cat artifact/verified-ci-sha)"

          CHIPIN_VERCEL_DEPLOY_ENABLED="$ACTIVATION_ENABLED" \
          CHIPIN_CI_RESULT="$CI_RESULT" \
          CHIPIN_CI_WORKFLOW="$CI_WORKFLOW" \
          CHIPIN_REPOSITORY="$REPOSITORY" \
          CHIPIN_SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
          CHIPIN_CURRENT_SOURCE_REPOSITORY="$current_source_repository" \
          CHIPIN_EVENT_NAME="$EVENT_NAME" \
          CHIPIN_BASE_REF="$BASE_REF" \
          CHIPIN_CURRENT_BASE_REF="$current_base_ref" \
          CHIPIN_SOURCE_BRANCH="$SOURCE_BRANCH" \
          CHIPIN_CURRENT_SOURCE_BRANCH="$current_source_branch" \
          CHIPIN_CI_SHA="$CI_SHA" \
          CHIPIN_CURRENT_SOURCE_SHA="$current_source_sha" \
          CHIPIN_CHECKED_OUT_SHA="$verified_artifact_sha" \
            node control/scripts/vercel-deploy-policy.mjs > /dev/null
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install trusted source dependencies
        working-directory: control
        run: npm ci
      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --prefix "$RUNNER_TEMP/vercel-cli" \
            --no-audit \
            --no-fund \
            "vercel@$VERCEL_CLI_VERSION"
      - name: Generate trusted static Vercel configuration
        working-directory: control
        env:
          VERCEL: '1'
          VERCEL_ENV: preview
          CHIPIN_TASK_BRANCH: ${{ needs.resolve.outputs.source_branch }}
          CHIPIN_TASK_HEAD_SHA: ${{ needs.resolve.outputs.ci_sha }}
          CHIPIN_UNTRUSTED_PREVIEW_BUILD: '1'
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" build --target=preview

          test -f .vercel/output/config.json
          test -d .vercel/output/static

          unexpected="$(
            find .vercel/output -mindepth 1 -maxdepth 1 \
              ! -name config.json \
              ! -name static \
              -print
          )"

          if [ -n "$unexpected" ]; then
            echo "Trusted preview configuration is not static-only:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          if find .vercel/output ! -type f ! -type d -print -quit | grep -q .; then
            echo "Trusted preview output contains an unsupported filesystem object."
            exit 1
          fi
      - name: Replace trusted static files with verified PR build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf control/.vercel/output/static
          mkdir -p control/.vercel/output/static
          cp -a artifact/dist/. control/.vercel/output/static/

          if [ -e control/.vercel/output/functions ]; then
            echo "Preview deployment must not contain runtime functions."
            exit 1
          fi

          rm -f control/.vercel/.env.preview.local
      - name: Recheck preview SHA immediately before publish
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_ENABLED: ${{ vars.VERCEL_ACTIONS_DEPLOY_ENABLED }}
          CI_RESULT: ${{ github.event.workflow_run.conclusion }}
          CI_WORKFLOW: ${{ github.event.workflow_run.name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
          EVENT_NAME: ${{ needs.resolve.outputs.event_name }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.source_branch }}
          CI_SHA: ${{ needs.resolve.outputs.ci_sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "/repos/$REPOSITORY/pulls/$PR_NUMBER")"
          current_source_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
          current_source_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          current_source_branch="$(jq -r '.head.ref // ""' <<<"$pr_json")"
          current_base_ref="$(jq -r '.base.ref // ""' <<<"$pr_json")"
          verified_artifact_sha="$(cat artifact/verified-ci-sha)"

          CHIPIN_VERCEL_DEPLOY_ENABLED="$ACTIVATION_ENABLED" \
          CHIPIN_CI_RESULT="$CI_RESULT" \
          CHIPIN_CI_WORKFLOW="$CI_WORKFLOW" \
          CHIPIN_REPOSITORY="$REPOSITORY" \
          CHIPIN_SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
          CHIPIN_CURRENT_SOURCE_REPOSITORY="$current_source_repository" \
          CHIPIN_EVENT_NAME="$EVENT_NAME" \
          CHIPIN_BASE_REF="$BASE_REF" \
          CHIPIN_CURRENT_BASE_REF="$current_base_ref" \
          CHIPIN_SOURCE_BRANCH="$SOURCE_BRANCH" \
          CHIPIN_CURRENT_SOURCE_BRANCH="$current_source_branch" \
          CHIPIN_CI_SHA="$CI_SHA" \
          CHIPIN_CURRENT_SOURCE_SHA="$current_source_sha" \
          CHIPIN_CHECKED_OUT_SHA="$verified_artifact_sha" \
            node control/scripts/vercel-deploy-policy.mjs > /dev/null
      - name: Deploy prebuilt static preview
        id: deploy
        working-directory: control
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CI_SHA: ${{ needs.resolve.outputs.ci_sha }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.source_branch }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" deploy \
              --prebuilt \
              --target=preview \
              --token="$VERCEL_TOKEN" \
              --meta "githubCommitSha=$CI_SHA" \
              --meta "githubRepository=$GITHUB_REPOSITORY" \
              --meta "githubCiRunId=${{ github.event.workflow_run.id }}" \
              --meta "githubSourceBranch=$SOURCE_BRANCH"
          )"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Vercel target: preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified SHA: $CI_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"

  deploy-protected:
    name: deploy-${{ needs.resolve.outputs.target }}
    needs: resolve
    if: >-
      ${{
        needs.resolve.outputs.target == 'staging' ||
        needs.resolve.outputs.target == 'production'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted deployment policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Checkout exact CI SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.ci_sha }}
          path: source
          persist-credentials: false
      - name: Verify protected source freshness
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_ENABLED: ${{ vars.VERCEL_ACTIONS_DEPLOY_ENABLED }}
          CI_RESULT: ${{ github.event.workflow_run.conclusion }}
          CI_WORKFLOW: ${{ github.event.workflow_run.name }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ needs.resolve.outputs.source_repository }}
          EVENT_NAME: ${{ needs.resolve.outputs.event_name }}
          BASE_REF: ${{ needs.resolve.outputs.base_ref }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.source_branch }}
          CI_SHA: ${{ needs.resolve.outputs.ci_sha }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_branch="$(jq -rn --arg value "$SOURCE_BRANCH" '$value|@uri')"
          current_source_sha="$(gh api "/repos/$REPOSITORY/branches/$encoded_branch" --jq '.commit.sha')"
          checked_out_sha="$(git -C source rev-parse HEAD)"

          CHIPIN_VERCEL_DEPLOY_ENABLED="$ACTIVATION_ENABLED" \
          CHIPIN_CI_RESULT="$CI_RESULT" \
          CHIPIN_CI_WORKFLOW="$CI_WORKFLOW" \
          CHIPIN_REPOSITORY="$REPOSITORY" \
          CHIPIN_SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
          CHIPIN_CURRENT_SOURCE_REPOSITORY="$REPOSITORY" \
          CHIPIN_EVENT_NAME="$EVENT_NAME" \
          CHIPIN_BASE_REF="$BASE_REF" \
          CHIPIN_CURRENT_BASE_REF="" \
          CHIPIN_SOURCE_BRANCH="$SOURCE_BRANCH" \
          CHIPIN_CURRENT_SOURCE_BRANCH="$SOURCE_BRANCH" \
          CHIPIN_CI_SHA="$CI_SHA" \
          CHIPIN_CURRENT_SOURCE_SHA="$current_source_sha" \
          CHIPIN_CHECKED_OUT_SHA="$checked_out_sha" \
            node control/scripts/vercel-deploy-policy.mjs > /dev/null
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install source dependencies
        working-directory: source
        run: npm ci
      - name: Install pinned Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install \
            --prefix "$RUNNER_TEMP/vercel-cli" \
            --no-audit \
            --no-fund \
            "vercel@$VERCEL_CLI_VERSION"
      - name: Pull Vercel project settings
        working-directory: source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET: ${{ needs.resolve.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" pull \
            --yes \
            --environment="$TARGET" \
            --token="$VERCEL_TOKEN"
      - name: Build Vercel artifact
        working-directory: source
        env:
          CHIPIN_TASK_BRANCH: ${{ needs.resolve.outputs.source_branch }}
          CHIPIN_TASK_HEAD_SHA: ${{ needs.resolve.outputs.ci_sha }}
          TARGET: ${{ needs.resolve.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" build --target="$TARGET"
      - name: Recheck source SHA before publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.source_branch }}
          CI_SHA: ${{ needs.resolve.outputs.ci_sha }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_branch="$(jq -rn --arg value "$SOURCE_BRANCH" '$value|@uri')"
          current_source_sha="$(gh api "/repos/$REPOSITORY/branches/$encoded_branch" --jq '.commit.sha')"

          if [ "$current_source_sha" != "$CI_SHA" ]; then
            echo "CI SHA is stale relative to the current source branch."
            exit 1
          fi
      - name: Deploy prebuilt Vercel artifact
        id: deploy
        working-directory: source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ needs.resolve.outputs.target }}
          CI_SHA: ${{ needs.resolve.outputs.ci_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(
            "$RUNNER_TEMP/vercel-cli/node_modules/.bin/vercel" deploy \
              --prebuilt \
              --target="$TARGET" \
              --token="$VERCEL_TOKEN" \
              --meta "githubCommitSha=$CI_SHA" \
              --meta "githubRepository=$GITHUB_REPOSITORY" \
              --meta "githubCiRunId=${{ github.event.workflow_run.id }}"
          )"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Vercel target: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified SHA: $CI_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
