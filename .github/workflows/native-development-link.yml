name: Native Development link

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to reconcile.
        required: true
        type: string
      task_identity:
        description: Optional canonical ChipIn task identity; must match any PR body marker.
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile native Issue ↔ PR Development relationship
        uses: ChipIn-one/.github/automation/development-link-action@7bca5de5ce24e4936cb5133101528d433aa0984e
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          task-identity: ${{ inputs.task_identity || '' }}
          token: ${{ github.token }}
