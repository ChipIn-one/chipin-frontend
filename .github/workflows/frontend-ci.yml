name: Frontend CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verified source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Require canonical Issue admission for PR
        # Only trusted Dependabot PRs targeting master are exempt;
        # task-authored PRs always require canonical Issue admission.
        if: github.event_name == 'pull_request' && !(github.base_ref == 'master' && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]')
        uses: ChipIn-one/.github/automation/issue-admission-action@8aa9092e5787349a7b9077c31f3a0e7f199d3bf6 # v1.7.2
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
      - name: Resolve verification mode
        id: gate
        env:
          CHIPIN_CI_WORKFLOW: frontend-ci
          CHIPIN_TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mode="full"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            mode="$(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-gate-policy.mjs)"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.gate.outputs.mode == 'full'
        run: npm ci
      - name: Verify frontend
        if: steps.gate.outputs.mode == 'full'
        # Step timeout (not only the job's) so a hang counts as a failure and notifies #chipin-ci.
        timeout-minutes: 18
        env:
          CHIPIN_TASK_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CHIPIN_TASK_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: npm run verify:full
      - name: Record cheap required-check path
        if: steps.gate.outputs.mode != 'full'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: echo "frontend-ci completed via $MODE path; verify:full was not required for this event."

  notify-master-failure:
    # Separate job: the Slack webhook never shares a runner with npm install scripts.
    name: Notify #chipin-ci on master failure
    needs: frontend-ci
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Post to Slack
        continue-on-error: true
        env:
          SLACK_WEBHOOK_CI: ${{ secrets.SLACK_WEBHOOK_CI }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_CI" ]; then
            echo "SLACK_WEBHOOK_CI is not set; skipping the Slack notification."
            exit 0
          fi
          payload="$(jq -n \
            --arg workflow "$WORKFLOW" --arg branch "$BRANCH" --arg sha "${SHA:0:7}" \
            --arg actor "$ACTOR" --arg commit "$COMMIT_URL" --arg run "$RUN_URL" \
            'def e: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
             {text: ":red_circle: \($workflow|e) failed on `\($branch|e)` at <\($commit)|\($sha)> by \($actor|e) - <\($run)|run>"}')"
          curl -sS --fail --max-time 10 -o /dev/null -H 'Content-Type: application/json' \
            --data "$payload" "$SLACK_WEBHOOK_CI"
