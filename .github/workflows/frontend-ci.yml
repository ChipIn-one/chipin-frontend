name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate release source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
        run: node scripts/release-source-policy.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend
        env:
          CHIPIN_TASK_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CHIPIN_TASK_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: npm run verify:full

  vercel-deploy:
    name: vercel-deploy
    needs: frontend-ci
    if: >-
      ${{
        needs.frontend-ci.result == 'success' &&
        vars.VERCEL_ACTIONS_DEPLOY_ENABLED == 'true' &&
        (
          (github.event_name == 'push' && github.ref_name == 'dev') ||
          (
            github.event_name == 'pull_request' &&
            github.base_ref == 'dev' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]'
          )
        )
      }}
    uses: ./.github/workflows/vercel-deploy.yml
    with:
      activation_enabled: ${{ vars.VERCEL_ACTIONS_DEPLOY_ENABLED }}
      ci_result: ${{ needs.frontend-ci.result }}
      event_name: ${{ github.event_name }}
      repository: ${{ github.repository }}
      source_repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      source_branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      base_ref: ${{ github.base_ref }}
      ci_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
