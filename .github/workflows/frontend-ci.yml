name: Frontend CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verified source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate release source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: node scripts/release-source-policy.mjs
      - name: Require canonical Issue admission for PR
        if: github.event_name == 'pull_request'
        uses: ChipIn-one/.github/automation/issue-admission-action@0e22b31f0e95ded3821bb0950214b0f0873379fb
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
      - name: Resolve verification mode
        id: gate
        env:
          CHIPIN_CI_WORKFLOW: frontend-ci
          CHIPIN_TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$CHIPIN_TARGET_BRANCH" = "main" ]; then
            mode="$(printf '' | node scripts/ci-gate-policy.mjs)"
          elif [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mode="full"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            mode="$(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-gate-policy.mjs)"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.gate.outputs.mode == 'full'
        run: npm ci
      - name: Verify frontend
        if: steps.gate.outputs.mode == 'full'
        env:
          CHIPIN_TASK_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CHIPIN_TASK_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: npm run verify:full
      - name: Record cheap required-check path
        if: steps.gate.outputs.mode != 'full'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: echo "frontend-ci completed via $MODE path; verify:full was not required for this event."
