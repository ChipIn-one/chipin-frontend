name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Notify Slack - CI started
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_FE_CI_CD }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            exit 0
          fi

          PR_REFERENCE="none"
          if [ -n "$PR_NUMBER" ]; then
            PR_REFERENCE="#$PR_NUMBER"
          fi

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW" \
            --arg status "started" \
            --arg branch "$BRANCH" \
            --arg pr "$PR_REFERENCE" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            '{text: ($repository + " - " + $workflow + "\nstatus: " + $status + "\nbranch: " + $branch + "\nPR: " + $pr + "\nactor: " + $actor + "\nrun: " + $run_url)}' \
            | curl --fail --silent --show-error --max-time 10 \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$SLACK_WEBHOOK"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Validate release source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPOSITORY" != "$THIS_REPOSITORY" ]; then
            echo "PRs to main must originate from the repository dev branch."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend
        env:
          CHIPIN_TASK_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CHIPIN_TASK_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: npm run verify:full
      - name: Notify Slack - CI completed
        if: ${{ always() && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]') }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_FE_CI_CD }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          STATUS: ${{ job.status }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            exit 0
          fi

          PR_REFERENCE="none"
          if [ -n "$PR_NUMBER" ]; then
            PR_REFERENCE="#$PR_NUMBER"
          fi

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW" \
            --arg status "$STATUS" \
            --arg branch "$BRANCH" \
            --arg pr "$PR_REFERENCE" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL" \
            '{text: ($repository + " - " + $workflow + "\nstatus: " + $status + "\nbranch: " + $branch + "\nPR: " + $pr + "\nactor: " + $actor + "\nrun: " + $run_url)}' \
            | curl --fail --silent --show-error --max-time 10 \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$SLACK_WEBHOOK"
