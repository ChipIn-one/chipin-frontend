name: Frontend CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read
  # Read earlier runs of this workflow on the PR head SHA (scripts/ci-gate-reuse.mjs).
  actions: read

concurrency:
  # PRs share a group per PR number. A new commit (opened, reopened, synchronize) or a base change
  # cancels the running run; `edited` and `ready_for_review` keep the head SHA, so they wait behind a
  # running gate instead of cancelling it, then reuse its result (chipin-frontend#792, docs/engineering/pr-metadata.md).
  # Each master push gets its own group (keyed by SHA), so a push run is never cancelled nor replaced
  # while pending: each one is release-QA evidence for its exact SHA and covers the diff from the
  # previous push.
  group: frontend-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && ((github.event.action != 'edited' && github.event.action != 'ready_for_review') || github.event.changes.base != null) }}

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verified source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Require canonical Issue admission for PR
        # Only trusted Dependabot PRs targeting master are exempt;
        # task-authored PRs always require canonical Issue admission.
        if: github.event_name == 'pull_request' && !(github.base_ref == 'master' && github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]')
        uses: ChipIn-one/.github/automation/issue-admission-action@8d90632a037019cf4878e20546028ab3eef8f34d # v1.14.1
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          expected-head-sha: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
      # `edited` and `ready_for_review` do not change the head SHA: admission above runs again (it
      # reads the PR and Issue bodies), the gate below is skipped when the newest earlier gate on this
      # SHA passed. A failed, cancelled or running gate is never reused; a base change runs the gate.
      - name: Resolve gate reuse
        id: reuse
        if: github.event_name == 'pull_request' && (github.event.action == 'ready_for_review' || (github.event.action == 'edited' && !github.event.changes.base))
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # A PR head branched before chipin-frontend#792 has no script: run the full gate.
        run: |
          if [ -f scripts/ci-gate-reuse.mjs ]; then
            node scripts/ci-gate-reuse.mjs
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve verification mode
        id: gate
        env:
          REUSE: ${{ steps.reuse.outputs.reuse }}
          CHIPIN_CI_WORKFLOW: frontend-ci
          CHIPIN_TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$REUSE" == true ]]; then
            mode="reused"
          elif [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mode="full"
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            mode="$(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-gate-policy.mjs)"
          fi

          case "$mode" in
            docs-only | app | site | full | reused) ;;
            *)
              echo "::error::unknown verification mode: $mode"
              exit 1
              ;;
          esac

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
      # Modes (scripts/ci-gate-policy.mjs, spec 04 §1.4): docs-only runs nothing below; app runs the
      # app gate; site runs the site gate; full runs both. The app gate is the root verify:full
      # (root ESLint, Prettier, packages typecheck, tests, build), so app and full run it unchanged.
      # reused (scripts/ci-gate-reuse.mjs) runs nothing below either: the same SHA already passed.
      - name: Install dependencies
        if: steps.gate.outputs.mode != 'docs-only' && steps.gate.outputs.mode != 'reused'
        run: npm ci
      - name: Check lint baseline does not grow
        if: github.event_name == 'pull_request' && (steps.gate.outputs.mode == 'app' || steps.gate.outputs.mode == 'full')
        env:
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
        run: node scripts/check-baseline.mjs --base "$BASE_SHA"
      - name: Check file layout baseline does not grow
        if: github.event_name == 'pull_request' && (steps.gate.outputs.mode == 'app' || steps.gate.outputs.mode == 'full')
        env:
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
        run: node scripts/check-file-layout.mjs --base "$BASE_SHA"
      - name: Check styled-components allowlist
        if: github.event_name == 'pull_request' && (steps.gate.outputs.mode == 'app' || steps.gate.outputs.mode == 'full')
        env:
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
        run: node scripts/check-styled-allowlist.mjs --base "$BASE_SHA"
      - name: Check generated API types
        if: steps.gate.outputs.mode == 'app' || steps.gate.outputs.mode == 'full'
        # Offline: regenerates from the committed apps/app/openapi/chipin.yaml and fails on any diff (spec 03 §5.5).
        run: npm run api:check
      - name: Verify frontend
        if: steps.gate.outputs.mode == 'app' || steps.gate.outputs.mode == 'full'
        # Step timeout (not only the job's) so a hang counts as a failure and notifies #ci.
        timeout-minutes: 18
        env:
          CHIPIN_TASK_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CHIPIN_TASK_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: npm run verify:full
      - name: Verify site
        if: steps.gate.outputs.mode == 'site' || steps.gate.outputs.mode == 'full'
        timeout-minutes: 10
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # apps/site arrives in 04-3a. Fail closed: site mode always needs the workspace, and full
          # mode needs it whenever the base already had it (a PR must not delete the site gate).
          # Removing the site on purpose (e.g. a revert of 04-3a) must edit this guard in the same
          # PR; that PR's own copy of this workflow is the one that runs.
          if [[ ! -f apps/site/package.json ]]; then
            if [[ "$MODE" == site ]]; then
              echo "::error::site mode without apps/site/package.json"
              exit 1
            fi
            if [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
              # A missing base commit must not read as "the base had no site".
              if ! git cat-file -e "$BASE_SHA^{commit}" 2> /dev/null; then
                echo "::error::base commit $BASE_SHA is not available; cannot tell whether it had apps/site"
                exit 1
              fi
              if git cat-file -e "$BASE_SHA:apps/site/package.json" 2> /dev/null; then
                echo "::error::apps/site/package.json existed at $BASE_SHA but is missing now"
                exit 1
              fi
            fi
            echo "apps/site/package.json is absent; site checks skipped (workspace not created yet)."
            exit 0
          fi

          # Mirrors the root lint:full / format:check over apps/site, so a green site run
          # implies full would be green for these files.
          npx --no-install prettier --check apps/site
          npx --no-install stylelint 'apps/site/**/*.{css,astro}' --max-warnings 0
          # `.astro` frontmatter is linted with types: `astro:content` types exist only after sync.
          npm run sync -w @chipin/site
          CHIPIN_ESLINT_FULL=1 npx --no-install eslint apps/site --max-warnings 0
          npm exec --no -w @chipin/site -- astro check
          # Build first: the site tests check the built dist (no SW registration, no redirect
          # shadowing an emitted file) and fail in CI when it is missing.
          npm exec --no -w @chipin/site -- astro build
          npm run test -w @chipin/site --if-present
      - name: Record verification mode
        env:
          MODE: ${{ steps.gate.outputs.mode }}
        run: |
          if [ "$MODE" = "docs-only" ]; then
            echo "frontend-ci completed via docs-only path; verify:full was not required for this event."
          elif [ "$MODE" = "reused" ]; then
            echo "frontend-ci reused the passed gate of this head SHA; only Issue admission ran again."
          else
            echo "frontend-ci completed via $MODE path."
          fi

  notify-master-failure:
    # Separate job: the Slack webhook never shares a runner with npm install scripts.
    name: 'Notify #ci on master failure'
    needs: frontend-ci
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      # Text only: event fields reach the shell through env; jq escapes `&<>` for Slack mrkdwn.
      - name: Build the Slack message
        id: message
        continue-on-error: true
        env:
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          text="$(jq -nr \
            --arg workflow "$WORKFLOW" --arg branch "$BRANCH" --arg sha "${SHA:0:7}" \
            --arg actor "$ACTOR" --arg commit "$COMMIT_URL" --arg run "$RUN_URL" \
            'def e: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
             ":red_circle: \($workflow|e) failed on `\($branch|e)` at <\($commit)|\($sha)> by \($actor|e) - <\($run)|run>"')"
          delimiter="ghadelimiter_$(cat /proc/sys/kernel/random/uuid)"
          printf 'text<<%s\n%s\n%s\n' "$delimiter" "$text" "$delimiter" >> "$GITHUB_OUTPUT"
      # The shared org action skips an empty webhook and never fails the job.
      - name: Post to Slack
        if: steps.message.outputs.text != ''
        continue-on-error: true
        uses: ChipIn-one/.github/automation/slack-notify-action@6a619d677a315e6dd145b68148634dcab8af8bea # v1.15.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_CI }}
          text: ${{ steps.message.outputs.text }}
          timeout-seconds: '10'
