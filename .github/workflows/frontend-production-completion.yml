name: Frontend production completion

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: frontend-production-completion
  cancel-in-progress: false

jobs:
  reconcile:
    name: Close Issues completed in production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile frontend production completion
        uses: ChipIn-one/.github/automation/frontend-production-completion-action@8fc0a8a268a10bc83c665e37fef83c14556f43ea # v1.4.0
        with:
          token: ${{ github.token }}
