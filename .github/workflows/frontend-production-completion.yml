name: Frontend production completion

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: frontend-production-completion
  cancel-in-progress: false

jobs:
  reconcile:
    name: Close Issues completed in production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile frontend production completion
        uses: ChipIn-one/.github/automation/frontend-production-completion-action@e003166dd1e0342ebec5dd25e42397e04621fdd6 # v1.0.0
        with:
          token: ${{ github.token }}
