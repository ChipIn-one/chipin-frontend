name: Prepare frontend release QA
run-name: QA prepare ${{ inputs.candidate_sha || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional full source SHA; empty resolves the newest master Preview with green frontend-ci
        required: false
        default: ''
        type: string
      deployment_id:
        description: Optional GitHub Preview deployment ID; empty resolves it from the candidate SHA
        required: false
        default: ''
        type: string
      priority:
        description: Canonical Priority for the QA Task
        required: false
        default: P2
        type: choice
        options: [P0, P1, P2, P3]
      qa_login:
        description: GitHub QA assignee; syllik makes the owner the only QA
        required: false
        default: SoRawSteak
        type: string
      reassign_qa:
        description: Owner explicitly moves an existing same-SHA QA Issue to qa_login
        required: false
        default: false
        type: boolean

# Every job sets its own permissions.
permissions: {}

# One preparation at a time: a zero-input run learns its SHA only after it starts.
concurrency:
  group: release-qa-${{ github.repository }}
  cancel-in-progress: false

# Trust boundary (docs/e2e-tests.md#release-browser-matrix): `resolve` and `prepare` run only the
# trusted workflow code of this master SHA and install nothing. `e2e` runs the candidate's npm
# install and test code with the staging Basic secrets and the optional Vercel bypass secret only;
# it never holds CHIPIN_DEV_READ_TOKEN, CHIPIN_ISSUE_WRITE_TOKEN or SLACK_WEBHOOK_CI, and its result
# files are untrusted input of `prepare`.
jobs:
  resolve:
    if: github.actor == 'syllik' && github.triggering_actor == 'syllik' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      deployment_id: ${{ steps.candidate.outputs.deployment_id }}
      url: ${{ steps.candidate.outputs.url }}
      fallback_head: ${{ steps.candidate.outputs.fallback_head }}
      fallback_missing: ${{ steps.candidate.outputs.fallback_missing }}
    steps:
      - name: Checkout trusted master workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Resolve candidate and immutable Preview
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREVIEW_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/release-qa-resolve.mjs

  # One job per profile, fail-fast off: every profile reports its own result. The checkout is the
  # candidate SHA, so the tests are the code the Preview was built from (resolve verified that the
  # SHA is inside current master).
  e2e:
    name: e2e ${{ matrix.profile }}
    needs: resolve
    if: github.actor == 'syllik' && github.triggering_actor == 'syllik' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: chromium
            browser: chromium
          - profile: firefox
            browser: firefox
          - profile: webkit
            browser: webkit
          - profile: pixel
            browser: chromium
          - profile: iphone
            browser: webkit
    steps:
      # Created before anything else, so the final purge step can delete the run's users even when
      # the test step is cancelled, times out or crashes. Unique per profile job.
      - name: Create run id
        id: run
        shell: bash
        run: |
          set -euo pipefail
          run_id="fe-e2e-$(date +%s%3N)-$(openssl rand -hex 6)"
          if [[ ! "$run_id" =~ ^fe-e2e-[0-9]{13}-[0-9a-f]{12}$ ]]; then
            echo "::error::Could not create a valid e2e run id"
            exit 1
          fi
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
          echo "E2E run id: $run_id"
      - name: Checkout candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Resolve Playwright version
        id: playwright
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/app/package.json').devDependencies['@playwright/test']")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::@playwright/test must be pinned to an exact version, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - name: Install the profile's browser
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: apps/app
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install --with-deps "$BROWSER"
      # The cache holds only the browser; its system libraries are installed on every runner.
      - name: Install the browser's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: apps/app
        env:
          BROWSER: ${{ matrix.browser }}
        run: npx playwright install-deps "$BROWSER"
      - name: Check staging API
        shell: bash
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 https://api-dev.chipin.one/users/self || true)"
          if [[ "$status" != "401" ]]; then
            echo "::error title=Staging API unavailable::Staging API https://api-dev.chipin.one is unavailable (GET /users/self answered '${status:-no response}', expected 401). The e2e matrix needs it; this is not a test failure."
            exit 1
          fi
      # The target is the resolved immutable Preview; playwright.config.ts rejects anything outside
      # its allowlist (production is forbidden). The run's purge is the global teardown inside this
      # step. The optional Vercel bypass secret is sent only to the Preview origin.
      - name: Run e2e on the Preview (smoke + money flows)
        id: e2e
        timeout-minutes: 6
        working-directory: apps/app
        env:
          CHIPIN_CONTRACT_SWAGGER_USER: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_USER }}
          CHIPIN_CONTRACT_SWAGGER_PASSWORD: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CHIPIN_E2E_RUN_ID: ${{ steps.run.outputs.id }}
          CHIPIN_E2E_BASE_URL: ${{ needs.resolve.outputs.url }}
          CHIPIN_E2E_JSON_REPORT: ${{ runner.temp }}/playwright-results.json
          PROFILE: ${{ matrix.profile }}
        run: npx playwright test --project="$PROFILE"
      # A fixed-shape summary for `prepare`: counts from the JSON report, status from the step
      # outcome, `error` when the suite produced no report. It holds no secret or session material.
      - name: Write profile result
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
          OUTCOME: ${{ steps.e2e.outcome }}
          REPORT: ${{ runner.temp }}/playwright-results.json
        shell: bash
        run: |
          set -euo pipefail
          status=error passed=0 failed=0 flaky=0 skipped=0
          if [[ -s "$REPORT" ]] && jq -e '.stats | [.expected, .unexpected, .flaky, .skipped] | all(type == "number" and . >= 0 and . == floor)' "$REPORT" >/dev/null; then
            read -r passed failed flaky skipped < <(jq -r '.stats | "\(.expected) \(.unexpected) \(.flaky) \(.skipped)"' "$REPORT")
            if [[ "$OUTCOME" == "success" ]]; then status=passed; else status=failed; fi
          fi
          mkdir -p "$RUNNER_TEMP/e2e-result"
          jq -n --arg profile "$PROFILE" --arg status "$status" \
            --argjson passed "$passed" --argjson failed "$failed" --argjson flaky "$flaky" --argjson skipped "$skipped" \
            '{version: 1, profile: $profile, status: $status, passed: $passed, failed: $failed, flaky: $flaky, skipped: $skipped}' \
            > "$RUNNER_TEMP/e2e-result/result.json"
          cat "$RUNNER_TEMP/e2e-result/result.json"
      - name: Upload profile result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-result-${{ matrix.profile }}
          path: ${{ runner.temp }}/e2e-result/result.json
          retention-days: 3
          if-no-files-found: ignore
      # The teardown writes the marker, holding the run id, only after its second purge found no
      # user of the run left. Without it nothing is scanned or uploaded.
      - name: Check verified purge
        id: purge-marker
        if: failure() && steps.e2e.outcome == 'failure'
        env:
          RUN_ID: ${{ steps.run.outputs.id }}
        shell: bash
        run: |
          marker="apps/app/test-results/.purge-verified"
          if [[ -f "$marker" && "$(cat "$marker")" == "$RUN_ID" ]]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Artifacts not uploaded::The run's purge was not verified, so the report and traces (they hold the run users' sessions) are not uploaded."
          fi
      # The repository is public: the report and traces are uploaded only after a verified purge and
      # only when they contain neither the Basic password, the Basic token nor the Vercel bypass
      # secret, also inside zip files and the HTML report's embedded data. Only file names are
      # printed, never a value.
      - name: Scan artifacts for credentials
        id: scan
        if: failure() && steps.purge-marker.outputs.verified == 'true'
        env:
          SWAGGER_USER: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_USER }}
          SWAGGER_PASSWORD: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_PASSWORD }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, os, re, sys, zipfile

          user = os.environ["SWAGGER_USER"].encode()
          password = os.environ["SWAGGER_PASSWORD"].encode()
          needles = [password, base64.b64encode(user + b":" + password)]
          if os.environ.get("VERCEL_BYPASS"):
              needles.append(os.environ["VERCEL_BYPASS"].encode())
          embedded = re.compile(rb"data:application/zip;base64,([A-Za-z0-9+/=]+)")
          hits = []

          def scan(label, data):
              if any(needle in data for needle in needles):
                  hits.append(label)
              if data[:4] == b"PK\x03\x04":
                  try:
                      with zipfile.ZipFile(io.BytesIO(data)) as archive:
                          for name in archive.namelist():
                              scan(f"{label}!{name}", archive.read(name))
                  except zipfile.BadZipFile:
                      hits.append(f"{label} (unreadable zip)")
              for match in embedded.finditer(data):
                  scan(f"{label}#embedded", base64.b64decode(match.group(1)))

          for root in ("apps/app/playwright-report", "apps/app/test-results"):
              for directory, _, files in os.walk(root):
                  for file in files:
                      path = os.path.join(directory, file)
                      with open(path, "rb") as handle:
                          scan(path, handle.read())

          if hits:
              for hit in hits:
                  print(f"::error::Credential material found in {hit}; the artifacts are not uploaded.")
              sys.exit(1)
          print("No credentials found in the Playwright report or test results.")
          PY
      - name: Upload Playwright report and traces
        if: failure() && steps.purge-marker.outputs.verified == 'true' && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qa-e2e-report-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/app/playwright-report
            apps/app/test-results
          retention-days: 3
          if-no-files-found: ignore
      # Also after a cancel, a timeout or a crash of the test step: deletes whatever the run left on
      # staging and logs the counts. Idempotent: after the teardown's purge it deletes nothing. The
      # credentials reach curl only through its stdin config, never its arguments or the log.
      - name: Purge the run on staging
        if: always() && steps.run.outputs.id != '' && contains(fromJSON('["success","failure","cancelled"]'), steps.e2e.outcome)
        timeout-minutes: 2
        env:
          SWAGGER_USER: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_USER }}
          SWAGGER_PASSWORD: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_PASSWORD }}
          RUN_ID: ${{ steps.run.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf '%s:%s' "$SWAGGER_USER" "$SWAGGER_PASSWORD" | base64 -w0)"
          echo "::add-mask::$token"
          body="$(mktemp)"
          purge() {
            local status
            status="$(printf 'header = "Authorization: Basic %s"\n' "$token" \
              | curl --silent --config - --request DELETE --output "$body" --write-out '%{http_code}' \
                --max-time 30 --retry 2 --retry-all-errors \
                "https://api-dev.chipin.one/auth/test-runs/$RUN_ID" || true)"
            if [[ "$status" != "200" ]]; then
              echo "::error title=Run purge failed::DELETE /auth/test-runs/$RUN_ID answered '${status:-no response}'; users of this run may remain on staging."
              exit 1
            fi
            jq -er --arg run "$RUN_ID" \
              'select(.runId == $run and (.deletedUsers | type) == "number") | "Purged run \(.runId): users=\(.deletedUsers) groups=\(.deletedGroups) expenses=\(.deletedExpenses) settlements=\(.deletedSettlements) activityEvents=\(.deletedActivityEvents)"' \
              "$body" || { echo "::error title=Run purge failed::The purge response for $RUN_ID is not the expected counts."; exit 1; }
          }
          purge
          # Verify: a second purge must find no user left (after a cancel this step is the only purge).
          purge
          if [[ "$(jq -r '.deletedUsers' "$body")" != "0" ]]; then
            echo "::error title=Run purge not verified::Users of run $RUN_ID were still present on the second purge."
            exit 1
          fi

  # Runs after the matrix whatever its outcome (not after a cancel of the whole run), so a failed or
  # missing matrix is still stated at the top of the QA Issue and in the Slack handoff.
  prepare:
    needs: [resolve, e2e]
    if: "!cancelled() && needs.resolve.result == 'success' && github.actor == 'syllik' && github.triggering_actor == 'syllik' && github.ref == 'refs/heads/master'"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
      issues: read
    steps:
      - name: Checkout trusted master workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout pinned canonical Issue Intake
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ChipIn-one/.github
          ref: 7dbcfb2b72fca2d477c14f4d242261d72a103dbd
          token: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
          path: .qa-shared
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # Data only: the script reads one result.json per known profile and validates it strictly.
      - name: Download profile results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-result-*
          path: ${{ runner.temp }}/e2e-results
      - name: Prepare canonical QA Issue and handoff
        env:
          CHIPIN_DEV_READ_TOKEN: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
          CHIPIN_ISSUE_WRITE_TOKEN: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
          SLACK_WEBHOOK_CI: ${{ secrets.SLACK_WEBHOOK_CI }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          PREVIEW_DEPLOYMENT_ID: ${{ needs.resolve.outputs.deployment_id }}
          CANDIDATE_FALLBACK_HEAD: ${{ needs.resolve.outputs.fallback_head }}
          CANDIDATE_FALLBACK_MISSING: ${{ needs.resolve.outputs.fallback_missing }}
          E2E_MATRIX_DIR: ${{ runner.temp }}/e2e-results
          QA_PRIORITY: ${{ inputs.priority }}
          QA_LOGIN: ${{ inputs.qa_login }}
          QA_REASSIGN: ${{ inputs.reassign_qa }}
        run: node scripts/release-qa-prepare.mjs
