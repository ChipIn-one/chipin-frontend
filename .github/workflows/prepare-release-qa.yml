name: Prepare frontend release QA
run-name: QA prepare ${{ inputs.candidate_sha || 'auto' }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Optional full source SHA; empty resolves the newest master Preview with green frontend-ci
        required: false
        default: ''
        type: string
      deployment_id:
        description: Optional GitHub Preview deployment ID; empty resolves it from the candidate SHA
        required: false
        default: ''
        type: string
      priority:
        description: Canonical Priority for the QA Task
        required: false
        default: P2
        type: choice
        options: [P0, P1, P2, P3]
      qa_login:
        description: GitHub QA assignee; syllik makes the owner the only QA
        required: false
        default: SoRawSteak
        type: string
      reassign_qa:
        description: Owner explicitly moves an existing same-SHA QA Issue to qa_login
        required: false
        default: false
        type: boolean

# Every job sets its own permissions.
permissions: {}

# One preparation at a time: a zero-input run learns its SHA only after it starts.
concurrency:
  group: release-qa-${{ github.repository }}
  cancel-in-progress: false

# Trust boundary (docs/e2e-tests.md#release-browser-matrix): `resolve` and `prepare` run only the
# trusted workflow code of this master SHA and install nothing. `e2e` (its steps in e2e-run.yml)
# runs the candidate's npm install and test code with the staging Basic secrets and the optional
# Vercel bypass secret only; it never holds CHIPIN_DEV_READ_TOKEN, CHIPIN_ISSUE_WRITE_TOKEN or
# SLACK_WEBHOOK_FE_RELEASES, and its result files are untrusted input of `prepare`.
jobs:
  resolve:
    if: github.actor == 'syllik' && github.triggering_actor == 'syllik' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      deployment_id: ${{ steps.candidate.outputs.deployment_id }}
      url: ${{ steps.candidate.outputs.url }}
      fallback_head: ${{ steps.candidate.outputs.fallback_head }}
      fallback_missing: ${{ steps.candidate.outputs.fallback_missing }}
    steps:
      - name: Checkout trusted master workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Resolve candidate and immutable Preview
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional; sent only to the validated Preview URL by the public-Preview probe.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PREVIEW_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: node scripts/release-qa-resolve.mjs

  # One job per profile, fail-fast off: every profile reports its own result. The checkout is the
  # candidate SHA, so the tests are the code the Preview was built from (resolve verified that the
  # SHA is inside current master). The steps live in the reusable e2e-run.yml, taken from this
  # trusted master SHA; GitHub shows each job as `e2e <profile> / run`, and the 15-minute job cap is
  # there (a job that `uses:` a workflow has no timeout-minutes).
  e2e:
    name: e2e ${{ matrix.profile }}
    needs: resolve
    if: github.actor == 'syllik' && github.triggering_actor == 'syllik' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: chromium
          - profile: firefox
          - profile: webkit
          - profile: pixel
          - profile: iphone
    uses: ./.github/workflows/e2e-run.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      project: ${{ matrix.profile }}
      target: preview
      base_url: ${{ needs.resolve.outputs.url }}
      report_artifact_name: release-qa-e2e-report-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
      test_timeout_minutes: 7
      # Every matrix profile: a candidate that lacks any of them reports all five as unsupported.
      all_projects: chromium firefox webkit pixel iphone
    secrets:
      CHIPIN_CONTRACT_SWAGGER_USER: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_USER }}
      CHIPIN_CONTRACT_SWAGGER_PASSWORD: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  # Runs after the matrix whatever its outcome (not after a cancel of the whole run), so a failed or
  # missing matrix is still stated at the top of the QA Issue and in the Slack handoff.
  prepare:
    needs: [resolve, e2e]
    if: "!cancelled() && needs.resolve.result == 'success' && github.actor == 'syllik' && github.triggering_actor == 'syllik' && github.ref == 'refs/heads/master'"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
      deployments: read
      issues: read
    steps:
      - name: Checkout trusted master workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout pinned canonical Issue Intake
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ChipIn-one/.github
          ref: 7dbcfb2b72fca2d477c14f4d242261d72a103dbd
          token: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
          path: .qa-shared
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # Data only: the script reads one result.json per known profile and validates it strictly.
      - name: Download profile results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-result-*
          path: ${{ runner.temp }}/e2e-results
      - name: Prepare canonical QA Issue and handoff
        id: prepare
        env:
          CHIPIN_DEV_READ_TOKEN: ${{ secrets.CHIPIN_DEV_READ_TOKEN }}
          CHIPIN_ISSUE_WRITE_TOKEN: ${{ secrets.CHIPIN_ISSUE_WRITE_TOKEN }}
          SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CANDIDATE_SHA: ${{ needs.resolve.outputs.sha }}
          PREVIEW_DEPLOYMENT_ID: ${{ needs.resolve.outputs.deployment_id }}
          CANDIDATE_FALLBACK_HEAD: ${{ needs.resolve.outputs.fallback_head }}
          CANDIDATE_FALLBACK_MISSING: ${{ needs.resolve.outputs.fallback_missing }}
          E2E_MATRIX_DIR: ${{ runner.temp }}/e2e-results
          QA_PRIORITY: ${{ inputs.priority }}
          QA_LOGIN: ${{ inputs.qa_login }}
          QA_REASSIGN: ${{ inputs.reassign_qa }}
        run: node scripts/release-qa-prepare.mjs
      # The shared org action holds the webhook alone; it never fails the job (result sent|skipped|failed).
      - name: Post to Slack
        id: slack
        if: steps.prepare.outputs.slack_post == 'true'
        continue-on-error: true
        uses: ChipIn-one/.github/automation/slack-notify-action@6a619d677a315e6dd145b68148634dcab8af8bea # v1.15.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_FE_RELEASES }}
          text: ${{ steps.prepare.outputs.slack_text }}
          timeout-seconds: '10'
      - name: Warn when Slack was not posted
        if: steps.prepare.outputs.slack_post == 'true' && steps.slack.outputs.result != 'sent'
        env:
          RESULT: ${{ steps.slack.outputs.result }}
          FAILURE: ${{ steps.prepare.outputs.slack_failure }}
        run: |
          if [ "$RESULT" = "skipped" ]; then
            echo "::warning::SLACK_WEBHOOK_FE_RELEASES is not configured; nothing was posted."
          else
            echo "::warning::$FAILURE"
          fi
