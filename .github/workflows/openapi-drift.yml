name: OpenAPI Drift

# Report only (spec 03 §5.5): staging is ahead of prod and is never a source of types.
# Schedule/dispatch open or update one "OpenAPI drift" issue when the generated types change;
# pull_request runs only fetch + artifact (the agent takes chipin.yaml with `gh run download`).
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/openapi-drift.yml
      - scripts/api/**
      - openapi/**

permissions:
  contents: read

concurrency:
  group: openapi-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  openapi-drift:
    name: openapi-drift
    # Fork and Dependabot PRs get no Actions secrets: skip them cleanly instead of failing the fetch (#655).
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.gen.outputs.drift }}
      stat: ${{ steps.gen.outputs.stat }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Install dependencies
        # No lifecycle scripts in the job that holds the secrets; fetch and api:gen do not need them.
        run: npm ci --ignore-scripts
      - name: Fetch staging OpenAPI
        env:
          CHIPIN_CONTRACT_SWAGGER_USER: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_USER }}
          CHIPIN_CONTRACT_SWAGGER_PASSWORD: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_PASSWORD }}
        run: npm run api:fetch:staging
      - name: Upload chipin.yaml
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chipin.yaml
          path: openapi/chipin.yaml
          if-no-files-found: error
          retention-days: 30
      - name: Generate types
        id: gen
        # A generator failure (e.g. a new unclassified number field) is drift too: report it.
        run: |
          paths=(openapi src/shared/api/generated src/shared/offline/modelHash.generated.ts)
          delimiter="DRIFT_$(openssl rand -hex 16)"
          if ! npm run -s api:gen 2> "$RUNNER_TEMP/drift.txt"; then
            echo "::warning::api:gen failed on the staging snapshot"
            { echo "npm run api:gen failed on the staging snapshot:"; cat "$RUNNER_TEMP/drift.txt"; } > "$RUNNER_TEMP/drift.tmp" && mv "$RUNNER_TEMP/drift.tmp" "$RUNNER_TEMP/drift.txt"
          elif [ -n "$(git status --porcelain --untracked-files=all -- "${paths[@]}")" ]; then
            echo "::warning::the staging snapshot differs from the committed one"
            { git status --porcelain --untracked-files=all -- "${paths[@]}"; git diff --stat -- "${paths[@]}"; } > "$RUNNER_TEMP/drift.txt"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/drift.txt"
          {
            echo "drift=true"
            echo "stat<<$delimiter"
            cat "$RUNNER_TEMP/drift.txt"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  report:
    name: report
    needs: openapi-drift
    # Never on pull_request: a PR run is a report in the run log only.
    if: needs.openapi-drift.outputs.drift == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the "OpenAPI drift" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRIFT_STAT: ${{ needs.openapi-drift.outputs.stat }}
        run: |
          title="OpenAPI drift"
          {
            echo "The staging OpenAPI (https://api-dev.chipin.one) differs from the committed snapshot."
            echo
            echo "Run: $RUN_URL (artifact \`chipin.yaml\`)."
            echo
            # A fence longer than any backtick run in the text, so the text cannot close it.
            longest=$(printf '%s' "$DRIFT_STAT" | grep -o '`*' | awk '{ if (length > n) n = length } END { print n + 0 }')
            fence=$(printf '%*s' $(( longest >= 3 ? longest + 1 : 3 )) '' | tr ' ' '`')
            echo "$fence"
            printf '%s\n' "$DRIFT_STAT"
            echo "$fence"
            echo
            echo "Report only: sync through a \"chore(api): sync openapi\" PR once prod has the change (spec 03 §5.3)."
          } > "$RUNNER_TEMP/drift-body.md"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/drift-body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/drift-body.md"
          fi
