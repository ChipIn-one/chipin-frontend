# Release caller for the frontend (chipin-frontend#586; registry `release: deploy-tag / production-deploy`,
# ChipIn-one/.github docs/workflow/release.md). Vercel writes an app Production deployment (`Production` or
# `Production – chipin-frontend`) at Promote to Production and can
# re-post a success status on an older Production deployment; every successful vercel[bot] status runs the guard, and
# a passed guard runs the reusable release workflow pinned to an org tag, which derives the version from
# `## Version impact` of the PRs merged into master since the previous tag and creates the tag and the GitHub Release on
# the promoted SHA. The trigger filter is the one of forward-production-deployment.yml, plus the status creator.
# The app's Production environment is `Production` or `Production – chipin-frontend` (a second Vercel project, chipin-site,
# suffixes the names; its `Production – chipin-site` never matches): the list lives in scripts/deployment-environments.mjs
# and scripts/deployment-environments.test.mjs keeps this condition equal to it (chipin-frontend#801).
# The guard job releases only a promoted SHA that is on master, is not older than the newest version tag and, if
# untagged, has the same .github/workflows as the master tip:
# - a SHA outside master (a promoted branch preview) gets no tag (the engine takes a deploy-tag SHA as is);
# - a re-posted status or a rollback promote of an already tagged SHA reaches the engine and is a no-op
#   (ALREADY_RELEASED);
# - an untagged SHA behind the newest tag (rollback promote, re-posted old status) gets no tag (no lower version after
#   a higher one);
# - an untagged SHA whose .github/workflows differs from the master tip fails the guard (red job, no release, no
#   redeploy): GitHub refuses GITHUB_TOKEN, which never holds the `workflows` permission, to create a tag on such a
#   commit (403 at the engine's tag step, #838). Promote the master tip build, or one whose workflow files equal it.
#   "Master tip" is master when the guard runs; a workflow change merged during the release still ends in the engine
#   403. A re-posted success status of such a build repeats the red run (harmless).
# A skip is a green run with a warning. A deployment_status run uses the workflow file at the deployment's SHA, so the
# first automatic release is the Promote of a master build that contains this file.
# After a fresh tag (engine outcome RELEASED) the redeploy job redeploys the same Vercel deployment to Production
# (scripts/redeploy-tagged-production.mjs): the Promote build ran before the tag existed and labelled itself untagged;
# the rebuild finds the tag on its commit. Loop-safe: the redeploy's own Production status reaches the engine as
# ALREADY_RELEASED, so no second redeploy. Needs secret VERCEL_TOKEN and variables VERCEL_TEAM_ID, VERCEL_PROJECT_ID;
# missing config or a Vercel error is a red job (tag and Release already exist; redeploy by hand). If Production moved
# to another deployment since the Promote (a newer Promote or a rollback), the redeploy is skipped with a warning.
# Remaining window: a Promote or rollback made while the redeploy builds (a few minutes) is overwritten when the
# redeploy finishes; Promote that deployment again. A RELEASE_MISSING repaired by the engine also reports RELEASED and
# triggers one extra, harmless redeploy of the already tagged deployment.
# The notify job posts one Slack message per Promote to #fe-releases (#484) after guard, release and redeploy,
# whatever their result, once the guard ran (not on a cancelled run): scripts/release-notify.mjs applies the rule
# table (RELEASED with the Included Issues of the Release, rollback, not released, other outcomes; ALREADY_RELEASED of
# the newest tag is silent) and the shared org Slack action posts it (secret SLACK_WEBHOOK_FE_RELEASES; 10 s timeout;
# never fails the run).
# Event fields reach `run:` only through env. Version from the tag and the redeploy: ChipIn-one/.github#172, #680.
name: Release on Production deployment

on:
  deployment_status:

permissions: {}

# Guard and release share one group, so a second quick Promote runs its guard only after the first release created
# its tag (a job-level group would let both guards pass before either tag exists, and the engine could then create a
# lower version after a higher one). Only statuses that pass the guard condition share the group; every other status
# gets its own. GitHub keeps one pending run per group: a third Production success (a quick Promote, or Vercel
# re-posting success on an older deployment) cancels the pending run; re-run the cancelled run to tag its SHA. The
# redeploy job's own Production status also joins this group, so it can cancel a pending Promote run the same way.
# The notify job runs inside the same run, so it holds the group too (about 30-60 s after redeploy, at most 3 min).
concurrency:
  group: ${{ (github.repository_owner == 'ChipIn-one' && contains(fromJSON('["Production","Production – chipin-frontend"]'), github.event.deployment.environment) && github.event.deployment_status.state == 'success' && github.event.deployment.creator.login == 'vercel[bot]' && github.event.deployment_status.creator.login == 'vercel[bot]') && format('release-{0}', github.repository) || format('no-release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  guard:
    if: >-
      github.repository_owner == 'ChipIn-one' &&
      contains(fromJSON('["Production","Production – chipin-frontend"]'), github.event.deployment.environment) &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.creator.login == 'vercel[bot]' &&
      github.event.deployment_status.creator.login == 'vercel[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.guard.outputs.release }}
      sha: ${{ steps.guard.outputs.sha }}
      skip_reason: ${{ steps.guard.outputs.skip_reason }}
      newest_tag: ${{ steps.guard.outputs.newest_tag }}
    steps:
      - name: Checkout master history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Require a master SHA not older than the newest tag, with master's workflow files
        id: guard
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          skip() { echo "::warning::No release for $DEPLOYED_SHA: $2"; { echo "skip_reason=$1"; echo "release=false"; } >> "$GITHUB_OUTPUT"; exit 0; }
          if [[ ! "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::deployment SHA '$DEPLOYED_SHA' is not a full commit SHA"; exit 1; fi
          newest="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -n 1 || true)"
          echo "newest_tag=$newest" >> "$GITHUB_OUTPUT"
          git cat-file -e "$DEPLOYED_SHA^{commit}" 2>/dev/null || skip not-in-history "the commit is not in this repository's fetched history"
          git merge-base --is-ancestor "$DEPLOYED_SHA" origin/master || skip not-on-master "the commit is not on master"
          tagged="$(git tag --points-at "$DEPLOYED_SHA" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || true)"
          if [[ -z "$tagged" && -n "$newest" ]]; then
            git merge-base --is-ancestor "$newest" "$DEPLOYED_SHA" || skip rollback-untagged "rollback to a commit behind the newest tag $newest"
          fi
          if [[ -z "$tagged" ]]; then
            # Tree OIDs only: no blob is fetched lazily in the blob:none clone. Exit 1 = differs, other non-zero = error.
            differs=0
            git diff-tree --quiet -r "$DEPLOYED_SHA" origin/master -- .github/workflows || differs=$?
            if [[ "$differs" -eq 1 ]]; then
              echo "::error::No release for $DEPLOYED_SHA: its .github/workflows differs from the master tip, and GITHUB_TOKEN cannot create a tag on such a commit (#838). Promote to Production the master tip build, or a build whose workflow files equal master."
              echo "Workflow files that differ from origin/master:"
              git diff-tree --name-only -r "$DEPLOYED_SHA" origin/master -- .github/workflows
              exit 1
            elif [[ "$differs" -ne 0 ]]; then
              echo "::error::Cannot compare .github/workflows of $DEPLOYED_SHA with origin/master (git diff-tree exit $differs)"
              exit 1
            fi
          fi
          echo "sha=$DEPLOYED_SHA" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    if: needs.guard.outputs.release == 'true'
    permissions:
      contents: write           # tags and GitHub Releases in this repository (the called workflow inherits this)
      pull-requests: read       # inventory: merged pull requests of the commits since the previous tag
    uses: ChipIn-one/.github/.github/workflows/release.yml@6a619d677a315e6dd145b68148634dcab8af8bea # v1.15.0
    with:
      ref: ${{ needs.guard.outputs.sha }}
      apply: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  redeploy:
    needs: [guard, release]
    if: needs.release.outputs.outcome == 'RELEASED'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read            # actions/checkout of this workflow's commit for the script; nothing is written
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Redeploy the tagged Production deployment in Vercel
        env:
          DEPLOYED_SHA: ${{ needs.guard.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
          DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: node scripts/redeploy-tagged-production.mjs

  notify:
    needs: [guard, release, redeploy]
    if: ${{ !cancelled() && needs.guard.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read            # checkout of the script and GET of the GitHub Release; nothing is written
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the Slack release message
        id: message
        env:
          GUARD_RELEASE: ${{ needs.guard.outputs.release }}
          GUARD_SKIP_REASON: ${{ needs.guard.outputs.skip_reason }}
          NEWEST_TAG: ${{ needs.guard.outputs.newest_tag }}
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_OUTCOME: ${{ needs.release.outputs.outcome }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          REDEPLOY_RESULT: ${{ needs.redeploy.result }}
          DEPLOYMENT_ENVIRONMENT_URL: ${{ github.event.deployment_status.environment_url }}
          DEPLOYMENT_TARGET_URL: ${{ github.event.deployment_status.target_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-notify.mjs
      - name: Post to Slack
        if: steps.message.outputs.post == 'true'
        continue-on-error: true
        uses: ChipIn-one/.github/automation/slack-notify-action@6a619d677a315e6dd145b68148634dcab8af8bea # v1.15.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_FE_RELEASES }}
          text: ${{ steps.message.outputs.text }}
          timeout-seconds: '10'
