name: Create milestone

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing [create-milestone] control Issue number to retry
        required: true
        type: string

permissions:
  contents: read
  issues: write

# Serialize the read/create/write sequence. queue:max prevents newer requests
# from silently evicting pending runs (the default queue is only one pending).
concurrency:
  group: chipin-create-milestone-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  create:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[create-milestone]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Process milestone control Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTROL_ISSUE_NUMBER: ${{ inputs.issue_number || '' }}
        run: node scripts/create-milestone.mjs
