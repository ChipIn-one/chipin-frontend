name: Vercel Exact Commit Deploy

on:
  repository_dispatch:
    types:
      - vercel-exact-deploy

permissions:
  actions: read
  contents: read

concurrency:
  group: vercel-exact-${{ github.event.client_payload.channel || 'invalid' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-${{ github.event.client_payload.channel || 'invalid' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_CLI_VERSION: 59.23.1
    steps:
      - name: Checkout trusted deployment policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: policy
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Resolve exact deployment evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SELECTED_SHA: ${{ github.event.client_payload.sha }}
          CHANNEL: ${{ github.event.client_payload.channel }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SELECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Selected deployment SHA must be a full 40-character Git SHA."
            exit 1
          fi
          SELECTED_SHA="${SELECTED_SHA,,}"

          case "$CHANNEL" in
            development)
              source_branch="dev"
              ;;
            production)
              source_branch="main"
              ;;
            *)
              echo "Unsupported deployment channel: $CHANNEL"
              exit 1
              ;;
          esac

          commit_sha="$(gh api "/repos/$REPOSITORY/commits/$SELECTED_SHA" --jq '.sha')"
          if [ "${commit_sha,,}" != "$SELECTED_SHA" ]; then
            echo "GitHub returned a commit that does not match the selected SHA."
            exit 1
          fi

          compare_status="$(gh api "/repos/$REPOSITORY/compare/$SELECTED_SHA...$source_branch" --jq '.status')"

          frontend_ci_json="$(gh api "/repos/$REPOSITORY/actions/workflows/frontend-ci.yml/runs?head_sha=$SELECTED_SHA&event=push&status=success&per_page=100")"
          frontend_ci_conclusion="$(jq -r --arg sha "$SELECTED_SHA" '
            [.workflow_runs[] | select(
              (.head_sha | ascii_downcase) == $sha
              and .event == "push"
              and .conclusion == "success"
            )]
            | if length > 0 then "success" else "missing" end
          ' <<<"$frontend_ci_json")"

          main_ci_conclusion="not-required"
          if [ "$CHANNEL" = "production" ]; then
            main_ci_json="$(gh api "/repos/$REPOSITORY/actions/workflows/main-ci.yml/runs?head_sha=$SELECTED_SHA&event=push&status=success&per_page=100")"
            main_ci_conclusion="$(jq -r --arg sha "$SELECTED_SHA" '
              [.workflow_runs[] | select(
                (.head_sha | ascii_downcase) == $sha
                and .event == "push"
                and .conclusion == "success"
              )]
              | if length > 0 then "success" else "missing" end
            ' <<<"$main_ci_json")"
          fi

          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "source_branch=$source_branch" >> "$GITHUB_OUTPUT"
          echo "compare_status=$compare_status" >> "$GITHUB_OUTPUT"
          echo "frontend_ci_conclusion=$frontend_ci_conclusion" >> "$GITHUB_OUTPUT"
          echo "main_ci_conclusion=$main_ci_conclusion" >> "$GITHUB_OUTPUT"

      - name: Checkout selected deployment SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.evidence.outputs.selected_sha }}
          fetch-depth: 1
          path: source
          persist-credentials: false

      - name: Validate deployment admission
        id: policy
        env:
          CHIPIN_EXACT_DEPLOY_ENABLED: ${{ vars.VERCEL_EXACT_DEPLOY_ENABLED }}
          CHIPIN_EXACT_PRODUCTION_ENABLED: ${{ vars.VERCEL_EXACT_PRODUCTION_ENABLED }}
          CHIPIN_REPOSITORY: ${{ github.repository }}
          CHIPIN_EVENT_NAME: ${{ github.event_name }}
          CHIPIN_DISPATCH_TYPE: ${{ github.event.action }}
          CHIPIN_WORKFLOW_REF: ${{ github.ref }}
          CHIPIN_SELECTED_SHA: ${{ steps.evidence.outputs.selected_sha }}
          CHIPIN_CHANNEL: ${{ github.event.client_payload.channel }}
          CHIPIN_SOURCE_BRANCH: ${{ steps.evidence.outputs.source_branch }}
          CHIPIN_COMPARE_STATUS: ${{ steps.evidence.outputs.compare_status }}
          CHIPIN_FRONTEND_CI_CONCLUSION: ${{ steps.evidence.outputs.frontend_ci_conclusion }}
          CHIPIN_MAIN_CI_CONCLUSION: ${{ steps.evidence.outputs.main_ci_conclusion }}
        shell: bash
        run: |
          set -euo pipefail

          checkout_sha="$(git -C source rev-parse HEAD)"
          if [ -n "$(git -C source status --porcelain --untracked-files=no)" ]; then
            echo "Selected source checkout contains tracked changes."
            exit 1
          fi

          CHIPIN_CHECKOUT_SHA="$checkout_sha" \
            node policy/scripts/vercel-exact-deploy-policy.mjs >> "$GITHUB_OUTPUT"

      - name: Verify Vercel credentials are configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Required Vercel credential/configuration is missing: $name"
              exit 1
            fi
          done

      - name: Link exact source checkout to Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/.vercel
          jq -n \
            --arg orgId "$VERCEL_ORG_ID" \
            --arg projectId "$VERCEL_PROJECT_ID" \
            '{orgId: $orgId, projectId: $projectId}' \
            > source/.vercel/project.json

      - name: Deploy exact selected SHA
        id: vercel
        working-directory: source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SELECTED_SHA: ${{ steps.policy.outputs.selected_sha }}
          SOURCE_BRANCH: ${{ steps.policy.outputs.source_branch }}
          CHANNEL: ${{ steps.policy.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail

          args=(
            deploy
            --yes
            --token "$VERCEL_TOKEN"
            --meta "githubCommitOrg=ChipIn-one"
            --meta "githubCommitRepo=chipin-frontend"
            --meta "githubCommitRef=$SOURCE_BRANCH"
            --meta "githubCommitSha=$SELECTED_SHA"
            --meta "githubDeployment=1"
            --meta "chipinExactCommitSha=$SELECTED_SHA"
          )

          if [ "$CHANNEL" = "production" ]; then
            args+=(--prod --skip-domain)
          else
            args+=(--target=preview)
          fi

          deployment_url="$(npx --yes "vercel@$VERCEL_CLI_VERSION" "${args[@]}")"
          if [[ ! "$deployment_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "Vercel CLI did not return a deployment URL on stdout."
            exit 1
          fi

          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify Vercel recorded the exact SHA
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.deployment_url }}
          SELECTED_SHA: ${{ steps.policy.outputs.selected_sha }}
          CHANNEL: ${{ steps.policy.outputs.channel }}
        shell: bash
        run: |
          set -euo pipefail

          deployment_host="${DEPLOYMENT_URL#https://}"
          encoded_deployment="$(jq -rn --arg value "$deployment_host" '$value|@uri')"
          encoded_team="$(jq -rn --arg value "$VERCEL_ORG_ID" '$value|@uri')"
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$encoded_deployment?teamId=$encoded_team")"

          deployment_id="$(jq -r '.id // empty' <<<"$response")"
          recorded_sha="$(jq -r '.meta.githubCommitSha // empty' <<<"$response" | tr '[:upper:]' '[:lower:]')"
          ready_state="$(jq -r '.readyState // .status // empty' <<<"$response")"
          target="$(jq -r '.target // empty' <<<"$response")"

          if [ -z "$deployment_id" ]; then
            echo "Vercel deployment response is missing the deployment ID."
            exit 1
          fi
          if [ "$recorded_sha" != "$SELECTED_SHA" ]; then
            echo "Vercel recorded SHA does not match the selected deployment SHA."
            exit 1
          fi
          if [ "$ready_state" != "READY" ]; then
            echo "Vercel deployment is not READY: $ready_state"
            exit 1
          fi
          if [ "$CHANNEL" = "production" ] && [ "$target" != "production" ]; then
            echo "Staged production deployment has unexpected target: $target"
            exit 1
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "recorded_sha=$recorded_sha" >> "$GITHUB_OUTPUT"

          {
            echo "Exact deployment evidence"
            echo "- selected CI SHA: $SELECTED_SHA"
            echo "- checked-out source SHA: $SELECTED_SHA"
            echo "- Vercel deployment ID: $deployment_id"
            echo "- Vercel recorded source SHA: $recorded_sha"
            echo "- Vercel deployment URL: $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Promote the exact staged production deployment
        if: steps.policy.outputs.promotes == 'true'
        working-directory: source
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.vercel.outputs.deployment_url }}
          SELECTED_SHA: ${{ steps.policy.outputs.selected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" promote "$DEPLOYMENT_URL" --yes --token "$VERCEL_TOKEN"
          {
            echo "- promoted deployment URL: $DEPLOYMENT_URL"
            echo "- promoted exact SHA: $SELECTED_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
