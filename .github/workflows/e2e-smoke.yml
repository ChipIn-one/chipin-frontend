name: E2E

# Chromium e2e (SMOKE-SHORT b-e and the money-critical flows, docs/e2e-tests.md) on the commit's
# code, served by the Vite dev server that proxies `/api` to the staging API. A non-required check
# (#665).
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its run; runs on master are never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fork and Dependabot pull requests get no repository secrets: the smoke job is then skipped
  # (shown as skipped, with a notice) instead of failing.
  check:
    name: check staging credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      available: ${{ steps.credentials.outputs.available }}
    steps:
      - name: Check staging credentials
        id: credentials
        env:
          SWAGGER_USER: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_USER }}
          SWAGGER_PASSWORD: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$SWAGGER_USER" && -n "$SWAGGER_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E smoke skipped::The staging Basic secrets are not available to this run (a fork or Dependabot pull request), so the Chromium smoke was skipped."
          fi

  # Trust boundary (docs/e2e-tests.md): same-repository pull request code, including its own
  # playwright.config.ts and the install scripts of its lockfile, runs in this job with the staging
  # Basic secrets in the test-run, artifact-scan and final purge steps (e2e-run.yml). Only the two
  # Basic secrets are passed, never `secrets: inherit` or the Vercel bypass secret.
  # The steps live in the reusable e2e-run.yml, so GitHub shows the check as `e2e-smoke / run`.
  e2e-smoke:
    name: e2e-smoke
    needs: check
    if: needs.check.outputs.available == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-run.yml
    with:
      ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # Only the desktop Chromium project; the other profiles run on release candidates
      # (prepare-release-qa.yml).
      project: chromium
      target: dev-server
      report_artifact_name: e2e-smoke-report-${{ github.run_id }}-${{ github.run_attempt }}
      test_timeout_minutes: 10
    secrets:
      CHIPIN_CONTRACT_SWAGGER_USER: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_USER }}
      CHIPIN_CONTRACT_SWAGGER_PASSWORD: ${{ secrets.CHIPIN_CONTRACT_SWAGGER_PASSWORD }}
