name: Dependabot Slack

on:
  pull_request:
    types:
      - opened

permissions: {}

jobs:
  dependabot-slack:
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Notify Slack - Dependabot PR opened
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_FE_DEPENDS_BOT }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            exit 0
          fi

          jq -n \
            --arg title "$PR_TITLE" \
            --arg number "$PR_NUMBER" \
            --arg target_branch "$TARGET_BRANCH" \
            --arg pr_url "$PR_URL" \
            '{text: ("Dependabot PR opened\ntitle: " + $title + "\nPR: #" + $number + "\ntarget branch: " + $target_branch + "\nlink: " + $pr_url)}' \
            | curl --fail --silent --show-error --max-time 10 \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$SLACK_WEBHOOK"
