version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'dev'
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'dev'
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: 'version-updates'
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'dev'
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
