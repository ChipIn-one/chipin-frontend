version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'master'
    open-pull-requests-limit: 2
    ignore:
      # Runtime is Node 24 (engines.node, CI node-version): a newer @types/node
      # major would type APIs that do not exist at runtime (#655).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-and-patch:
        applies-to: 'version-updates'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'master'
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: 'version-updates'
        patterns:
          - '*'

  # Dependabot security updates always target the default branch (master), the
  # same branch as version updates; see docs/dependabot-security-updates.md.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: 'security-updates'
        patterns:
          - '*'
